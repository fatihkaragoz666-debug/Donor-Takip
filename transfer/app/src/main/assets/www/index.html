<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antalya Transfer Takibi 2026</title>
<style>
:root{
  /* Layout: app shell. Crimson band on top, a departures-board banner, time-slot cards keyed by flight time, fixed bottom tabs. */
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#14202c; --muted:#5a6876; --line:#d7dde3;
  --brand:#a8102a; --on-brand:#ffffff;
  --accent:#173d63; --on-accent:#ffffff; --accent-soft:#e2ebf4;
  --board-bg:#121a22; --board-ink:#e9eef3; --board-hi:#ffc93c;
  --ok:#17784a; --ok-soft:#dcf1e4; --warn:#975800; --warn-soft:#fbeed5; --bad:#bf2629; --bad-soft:#fbe2e0; --info:#2a62a5; --info-soft:#e0eaf7;
  --font-display:"Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;
  --font-body:Roboto,"Noto Sans",system-ui,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(20,32,44,.06),0 3px 10px rgba(20,32,44,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#16202a; --surface-2:#1c2732; --ink:#e6ecf2; --muted:#9aa8b6; --line:#2a3743;
    --brand:#8f1124; --on-brand:#ffffff;
    --accent:#86b6e6; --on-accent:#0e141a; --accent-soft:#1b3046;
    --board-bg:#070b0f; --board-ink:#e6ecf2; --board-hi:#ffc93c;
    --ok:#53c78f; --ok-soft:#14301f; --warn:#f0aa45; --warn-soft:#352610; --bad:#ff7a72; --bad-soft:#3a1918; --info:#86b6e6; --info-soft:#172a3d;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#16202a; --surface-2:#1c2732; --ink:#e6ecf2; --muted:#9aa8b6; --line:#2a3743;
  --brand:#8f1124; --on-brand:#ffffff;
  --accent:#86b6e6; --on-accent:#0e141a; --accent-soft:#1b3046;
  --board-bg:#070b0f; --board-ink:#e6ecf2; --board-hi:#ffc93c;
  --ok:#53c78f; --ok-soft:#14301f; --warn:#f0aa45; --warn-soft:#352610; --bad:#ff7a72; --bad-soft:#3a1918; --info:#86b6e6; --info-soft:#172a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{text-wrap:balance}
summary{list-style:none}summary::-webkit-details-marker{display:none}
html{-webkit-tap-highlight-color:transparent}

/* top band */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--on-brand);padding:calc(var(--sat,0px) + 9px) 16px 9px}
.top-row{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto}
.mark{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.mark .ico{width:21px;height:21px}
.top h1{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.03em;margin:0;line-height:1.05;text-transform:uppercase}
.top .sub{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px;margin-top:2px}
.sdot{width:8px;height:8px;border-radius:50%;background:#9fb0bf;display:inline-block}
.sdot.ok{background:#5ee39b}.sdot.wait{background:#ffc93c}.sdot.bad{background:#ff8f87}
.clock{margin-left:auto;text-align:right;font-family:var(--font-display);line-height:1}
.clock b{display:block;font-size:24px;font-weight:600}
.clock span{font-size:12px;opacity:.85}

main{max-width:860px;margin:0 auto;padding:12px 16px calc(88px + var(--sab,0px));display:grid;gap:12px}

/* bottom tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sab,0px)}
.tabs-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tab .ico{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:3px;left:calc(50% + 5px);background:var(--bad);color:#fff;border-radius:9px;font-size:10.5px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-weight:700}

/* generic */
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.disp{font-family:var(--font-display);letter-spacing:.02em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:var(--surface)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:34px;font-size:13.5px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;line-height:1.5}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.prog,.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.pend{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.mute{color:var(--muted)}
.veh{font-family:var(--font-display);letter-spacing:.05em;text-transform:uppercase;font-size:13px}
.chip .ico{width:14px;height:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.panel h3,.sec-h{margin:0;font-family:var(--font-display);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.sec-h{font-size:15px;color:var(--muted);margin-top:4px}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.note{border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--info-soft);color:var(--info)}
.note .ico{margin-top:1px}

/* day picker + segmented */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 12px 6px;text-align:left;min-width:78px;position:relative}
.day b{display:block;font-family:var(--font-display);font-size:24px;line-height:1;font-weight:700}
.day span{font-size:11.5px;color:var(--muted);display:block}
.day i{position:absolute;top:6px;right:7px;font-style:normal;font-size:11px;font-weight:700;color:var(--accent)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day[aria-pressed="true"] span,.day[aria-pressed="true"] i{color:inherit;opacity:.9}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 6px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.seg small{font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:0 6px}

/* board banner */
.board{background:var(--board-bg);color:var(--board-ink);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.board .lbl{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:12px;opacity:.75;grid-column:1/-1}
.board .big{font-family:var(--font-display);font-size:40px;font-weight:700;color:var(--board-hi);line-height:1;letter-spacing:.02em}
.board .big.red{color:#ff8f87}
.board .txt{font-size:14px;line-height:1.35}
.board .txt b{font-weight:700}

/* slot cards */
.slot{overflow:hidden;border-left:5px solid var(--accent)}
.slot.st-ok{border-left-color:var(--ok)}
.slot.st-warn{border-left-color:var(--warn)}
.slot.st-bad{border-left-color:var(--bad)}
.slot-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 12px 11px 12px;width:100%;background:none;border:0;text-align:left}
.time{min-width:68px;font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;letter-spacing:.01em}
.time small{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:3px;text-transform:uppercase}
.slot-main{display:grid;gap:5px;min-width:0}
.slot-title{font-weight:700;font-size:15.5px}
.slot-kurum{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:grid;justify-items:end;gap:4px;font-size:12.5px;font-weight:700}
.bar{width:64px;height:6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.load i{background:var(--accent)}
.bar.load.over i{background:var(--bad)}
.slot-tools{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface-2)}

.prow{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.prog{background:var(--info)}.dot.mute{background:var(--line)}
.pname{font-weight:600;background:none;border:0;padding:0;text-align:left;font-size:15px;line-height:1.25}
.psub{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.act{border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px;white-space:nowrap;min-height:36px}
.act.done{border-color:transparent;background:var(--ok-soft);color:var(--ok);display:inline-flex;align-items:center;gap:4px;cursor:default}
.act.bad{border-color:transparent;background:var(--bad-soft);color:var(--bad);cursor:default}
.act.mute{border-color:transparent;background:var(--surface-2);color:var(--muted);cursor:default}

/* trip cards */
.trip{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.trip .meta{font-size:12.5px;color:var(--muted)}
.load{font-weight:700;font-size:14px;text-align:right}
.load.over{color:var(--bad)}

/* people list */
.search{position:sticky;top:calc(var(--sat,0px) + 56px);z-index:10;background:var(--bg);padding:4px 0 6px;display:grid;gap:8px}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:44px;width:100%}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kgroup{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 12px 6px;font-weight:700}
.person{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.legs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.lp{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.lp.ok{background:var(--ok-soft);color:var(--ok)}.lp.warn{background:var(--warn-soft);color:var(--warn)}.lp.bad{background:var(--bad-soft);color:var(--bad)}.lp.prog{background:var(--info-soft);color:var(--info)}.lp.mute{background:var(--surface-2);color:var(--muted)}

/* issues */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font-family:var(--font-display);font-size:30px;line-height:1;font-weight:700}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi.info b{color:var(--info)}.kpi.ok b{color:var(--ok)}
.iss{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.ihead{display:flex;align-items:center;gap:8px;padding:11px 12px;font-weight:700}
.ihead .ico{width:18px;height:18px}
.ihead.bad{color:var(--bad)}.ihead.warn{color:var(--warn)}.ihead.info{color:var(--info)}
.cta{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);border:0;text-align:left;width:100%}
.cta b{display:block;font-size:15px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.n{text-align:right}
tfoot td{font-weight:700;border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(8,13,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden],.dlg-wrap[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:93%;border-radius:16px 16px 0 0;overflow:auto;overscroll-behavior:contain}
.sheet-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px 12px 16px;display:flex;align-items:center;gap:10px;z-index:3}
.sheet-head h2{margin:0;font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1.1;flex:1;min-width:0}
.sheet-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-family:var(--font-body)}
.x{border:0;background:var(--surface-2);border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.sheet-body{padding:14px 16px calc(18px + var(--sab,0px));display:grid;gap:12px}
.sheet-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--sab,0px));display:flex;gap:8px;z-index:3}
.sheet-foot .btn{flex:1}
@media(min-width:720px){.sheet-wrap{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;min-height:42px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sts{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.sbtn[aria-pressed="true"].pend{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sbtn[aria-pressed="true"].prog{background:var(--info);color:#fff;border-color:var(--info)}
.sbtn[aria-pressed="true"].ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.sbtn[aria-pressed="true"].warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.sbtn[aria-pressed="true"].bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.sbtn[aria-pressed="true"].mute{background:var(--muted);color:var(--bg);border-color:var(--muted)}
.hist{display:grid;gap:0;font-size:13px}
.hist div{padding:7px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:10px}
.hist time{color:var(--muted);white-space:nowrap}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.check input[type=checkbox],.check input[type=radio]{width:20px;height:20px;accent-color:var(--accent)}
.srow{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.srow input{width:20px;height:20px;accent-color:var(--accent)}
.srow select{grid-column:2;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;width:100%;min-height:40px}
.check select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;max-width:210px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
pre.copy{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin:0;max-height:240px;overflow:auto}

/* toast + dialog */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--sab,0px));z-index:70;background:var(--ink);color:var(--bg);border-radius:11px;padding:10px 14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 28px rgba(0,0,0,.28);font-size:14px}
.toast[hidden]{display:none}
.toast.bad{background:var(--bad);color:#fff}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px}
.dlg-wrap{position:fixed;inset:0;z-index:80;background:rgba(8,13,18,.55);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:14px;max-width:420px;width:100%;padding:18px;display:grid;gap:12px}
.dlg h2{margin:0;font-family:var(--font-display);font-size:21px}
.dlg p{margin:0;color:var(--muted)}
.dlg-btns{display:grid;gap:8px}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="mark" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M2 16V7.5A1.5 1.5 0 0 1 3.5 6H14l4 4h2.2A1.8 1.8 0 0 1 22 11.8V16h-2"/><path d="M2 16h2.5M9.5 16h5"/><circle cx="7" cy="16.5" r="2.2"/><circle cx="17.2" cy="16.5" r="2.2"/><path d="M14 6v4h4"/></svg></div>
    <div>
      <h1>Antalya Transfer 2026</h1>
      <div class="sub" id="sync"><span class="sdot"></span><span>Bağlanıyor…</span></div>

<script>
'use strict';
/* ================= constants ================= */
const YON=['gelis','donus'];
const YON_T={gelis:'Geliş',donus:'Dönüş'};
const YON_L={gelis:'Havalimanı → Otel',donus:'Otel → Havalimanı'};
const YON_SHEET={gelis:'HAVALİMANI-OTEL',donus:'OTEL-HAVALİMANI'};
const SAAT_T={gelis:'Varış',donus:'Biniş'};
const ARAC=['VİTO','CRAFTER','OTOBÜS','DİĞER'];
const ARAC_T={'VİTO':'Vito','CRAFTER':'Crafter','OTOBÜS':'Otobüs','DİĞER':'Diğer'};
const CAP0={'VİTO':9,'CRAFTER':19,'OTOBÜS':28,'DİĞER':4};
const DUR={
  gelis:[['bekliyor','Bekleniyor','pend'],['rotar','Rötarlı','warn'],['karsilandi','Karşılandı','prog'],['otelde','Otele ulaştı','ok'],['gelmedi','Gelmedi','bad'],['kendi','Kendi imkânıyla','mute'],['iptal','İptal','mute']],
  donus:[['bekliyor','Bekleniyor','pend'],['bindi','Araca bindi','prog'],['birakildi','Havalimanına bırakıldı','ok'],['gelmedi','Araca gelmedi','bad'],['kendi','Kendi imkânıyla','mute'],['iptal','İptal','mute']]
};
const FLOW={gelis:['bekliyor','rotar','karsilandi','otelde'],donus:['bekliyor','bindi','birakildi']};
const BULK={gelis:['karsilandi','otelde'],donus:['bindi','birakildi']};
const STEP1={gelis:'karsilandi',donus:'bindi'};
const NEXT={gelis:{bekliyor:['karsilandi','Karşılandı'],rotar:['karsilandi','Karşılandı'],karsilandi:['otelde','Otele ulaştı']},donus:{bekliyor:['bindi','Bindi'],bindi:['birakildi','Bırakıldı']}};
const DONE={gelis:'otelde',donus:'birakildi'};
const TDUR=[['planli','Planlandı','pend'],['yolda','Yolda','prog'],['tamam','Tamamlandı','ok'],['iptal','İptal','mute']];
const TABS=[['akis','Akış','clock'],['araclar','Araçlar','van'],['kisiler','Kişiler','users'],['kontrol','Kontrol','alert'],['ozet','Özet','chart']];
const TR_DAY=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const TR_MON=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const CACHE_KEY='antalya-transfer-2026-cache-v1';
const NB=window.AndroidBridge||null;

const ICONS={
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  van:'<path d="M2 16V7.5A1.5 1.5 0 0 1 3.5 6H14l4 4h2.2A1.8 1.8 0 0 1 22 11.8V16h-2"/><path d="M2 16h2.5M9.5 16h5"/><circle cx="7" cy="16.5" r="2.2"/><circle cx="17.2" cy="16.5" r="2.2"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-.5A5.5 5.5 0 0 1 8 14h2a5.5 5.5 0 0 1 5.5 5.5v.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.3A5.5 5.5 0 0 1 21.5 19.5v.5"/>',
  alert:'<path d="M10.3 3.9 2.4 17.6A2 2 0 0 0 4.1 20.6h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4M12 17h.01"/>',
  chart:'<path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/>',
  plane:'<path d="M10.2 13.3 3 15.5v-2l7.2-4.5V4.3a1.8 1.8 0 0 1 3.6 0V9l7.2 4.5v2l-7.2-2.2v4.4l2.4 1.8V21L12 20l-4.2 1v-1.5l2.4-1.8z"/>',
  hotel:'<path d="M4 21V4.8A.8.8 0 0 1 4.8 4h9.4a.8.8 0 0 1 .8.8V21M15 10h4.2a.8.8 0 0 1 .8.8V21M2 21h20M8 8h3M8 12h3M8 16h3"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',
  down:'<path d="m6 9 6 6 6-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  ul:'<path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>',
  phone:'<path d="M5 4h3.5l1.8 4.5-2.3 1.4a11 11 0 0 0 6.1 6.1l1.4-2.3L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',
  wand:'<path d="m14 6 4 4M4 20 15.5 8.5M17 2v3M20.5 5.5h-3M21 10v2M10 3h2"/>'
};
const ic=(n,c='ico')=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
const fold=s=>clean(s).toLocaleUpperCase('tr-TR').replace(/İ/g,'I').replace(/Ş/g,'S').replace(/Ğ/g,'G').replace(/Ü/g,'U').replace(/Ö/g,'O').replace(/Ç/g,'C').replace(/Â/g,'A').replace(/Î/g,'I').replace(/Û/g,'U');
const nameKey=s=>fold(s).replace(/^DR(\.\s*|\s+)/,'DR ').replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const up=s=>clean(s).toLocaleUpperCase('tr-TR');
const toMin=s=>{const m=/^(\d{1,2}):(\d{2})/.exec(s||'');return m?(+m[1])*60+(+m[2]):null;};
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const trDate=d=>d?d.split('-').reverse().join('.'):'';
const shortDate=d=>d?d.slice(8,10)+'.'+d.slice(5,7):'';
const pad=n=>String(n).padStart(2,'0');
const ymd=dt=>dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
const todayStr=()=>ymd(new Date());
const dayInfo=d=>{const dt=new Date(d+'T12:00:00');return{num:dt.getDate(),mon:TR_MON[dt.getMonth()],wd:TR_DAY[dt.getDay()]};};
const dayLong=d=>{const i=dayInfo(d);return `${i.num} ${i.mon} ${i.wd}`;};
const legTime=(d,s)=>d&&s?new Date(d+'T'+s+':00').getTime():null;
const durOf=(y,k)=>DUR[y].find(d=>d[0]===k)||[k,k||'—','pend'];
const durT=(y,k)=>durOf(y,k)[1];
const durC=(y,k)=>durOf(y,k)[2];
const tdurOf=k=>TDUR.find(d=>d[0]===k)||TDUR[0];
const misafir=L=>Math.max(0,parseInt(L&&L.misafir,10)||0);
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nowIso=()=>new Date().toISOString();
const fmtTime=iso=>{if(!iso)return'';const d=new Date(iso);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
const hm=iso=>{if(!iso)return'';const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes());};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function deepMerge(a,b){const o=Object.assign({},a||{});for(const k of Object.keys(b)){const v=b[k];if(isObj(v)&&v.__delete__){delete o[k];}else if(isObj(v)&&isObj(o[k]))o[k]=deepMerge(o[k],v);else o[k]=v;}return o;}
const capOf=a=>{const m=S.meta&&S.meta.kapasite;return (m&&+m[a])||CAP0[a]||0;};
const tripLabel=t=>t?`${t.saat||'--:--'} ${ARAC_T[t.arac]||t.arac||''}${t.plaka?' · '+t.plaka:''}`:'';

/* leg predicates */
const activeLeg=(p,L)=>!!L&&p.katilim!==false&&L.durum!=='iptal'&&L.durum!=='kendi';
const rides=(p,L)=>activeLeg(p,L)&&L.durum!=='gelmedi';
const isOpen=x=>activeLeg(x.p,x.L)&&x.L.durum!==DONE[x.y]&&x.L.durum!=='gelmedi';
const graceMin=y=>y==='gelis'?45:20;
const overdue=(d,s,y)=>{const t=legTime(d,s);return t!=null&&Date.now()>t+graceMin(y)*60000;};

/* ================= state ================= */
const S={rawP:new Map(),rawT:new Map(),people:new Map(),trips:new Map(),meta:{},
  loadedP:false,loadedT:false,fromCache:true,slow:false,noDb:false,cacheMode:false,cacheTime:null,
  db:null,user:null,dl:null,uid:'',canWrite:true,
  tab:'akis',day:null,yon:'gelis',yonManual:false,tday:null,q:'',filt:'tumu',
  open:new Set(),sheet:null,dirty:false,failed:[],idx:{load:new Map(),pax:new Map()},issues:[],sugg:[],names:{}};

/* ================= write queue ================= */
const Q=[];let busy=false;
function enqueue(job){
  if(!S.db){toast('Kaydedilemiyor: veritabanı bağlantısı yok.','bad');return false;}
  if(!S.canWrite){toast('Bu sayfada değişiklik yetkiniz yok (salt okunur).','bad');return false;}
  Q.push(job);rebuild();pump();return true;
}
async function runJob(j){
  const ref=S.db.doc(j.path);
  if(j.op==='set')return ref.set(j.data);
  if(j.op==='delete')return ref.delete();
  return ref.update(j.data);
}
async function pump(){
  if(busy)return;busy=true;renderSync();
  while(Q.length){
    const j=Q[0];
    try{await runJob(j);Q.shift();}
    catch(e){
      const code=e&&e.code;
      if((code==='unavailable'||!code)&&(j.tries||0)<2){j.tries=(j.tries||0)+1;await sleep(700+Math.random()*900);continue;}
      Q.shift();
      if(code==='invalid_argument'&&j.op==='set'){S.canWrite=false;}
      S.failed.push({job:j,err:e});
      toast(`Kaydedilemedi (${j.label||j.path}): ${errText(e)}`,'bad',{label:'Tekrar dene',fn:retryFailed},9000);
    }
    rebuild();
  }
  busy=false;renderSync();
}
function errText(e){const c=e&&e.code;return({quota_exceeded:'kapasite doldu',resource_exhausted:'çok hızlı işlem, birkaç saniye sonra tekrar deneyin',revoked:'erişim kaldırıldı',unavailable:'bağlantı yok',invalid_argument:'kayıt reddedildi'})[c]||(e&&e.message)||'bilinmeyen hata';}
function retryFailed(){const f=S.failed.splice(0);for(const x of f){x.job.tries=0;Q.push(x.job);}rebuild();pump();}

function rebuild(){
  const P=new Map(S.rawP),T=new Map(S.rawT);
  for(const j of Q){
    const [c,id]=j.path.split('/');const M=c==='kisiler'?P:c==='seferler'?T:null;
    if(c==='meta'&&id==='ayarlar'&&j.op!=='delete'){S.meta=deepMerge(S.meta,j.data);continue;}
    if(!M)continue;
    if(j.op==='delete')M.delete(id);
    else if(j.op==='set')M.set(id,Object.assign({},j.data,{id}));
    else{const b=M.get(id);if(b)M.set(id,deepMerge(b,j.data));}
  }
  S.people=P;S.trips=T;render();
}

/* ================= data writes ================= */
const logE=m=>({t:nowIso(),u:S.uid||'',m});
function updPerson(p,patch,msgs){
  const g=[...(p.gecmis||[]),...msgs.map(logE)].slice(-50);
  return enqueue({op:'update',path:'kisiler/'+p.id,data:Object.assign({},patch,{gecmis:g,guncelleme:nowIso(),guncelleyen:S.uid||''}),label:p.ad});
}
function updTrip(t,patch,msgs){
  const g=[...(t.gecmis||[]),...msgs.map(logE)].slice(-50);
  return enqueue({op:'update',path:'seferler/'+t.id,data:Object.assign({},patch,{gecmis:g,guncelleme:nowIso(),guncelleyen:S.uid||''}),label:'Sefer '+tripLabel(t)});
}
function setDur(pid,y,k,opt={}){
  const p=S.people.get(pid);if(!p||!p[y])return null;
  const prev=p[y].durum;if(prev===k)return null;
  updPerson(p,{[y]:{durum:k,durumZaman:nowIso()}},[`${YON_T[y]} durumu: ${durT(y,prev)} → ${durT(y,k)}`]);
  if(!opt.silent)toast(`${p.ad}: ${durT(y,k)}`,'',{label:'Geri al',fn:()=>undoDur([{pid,y,prev}])});
  return {pid,y,prev};
}
function undoDur(list){
  for(const u of list){const p=S.people.get(u.pid);if(!p||!p[u.y])continue;updPerson(p,{[u.y]:{durum:u.prev,durumZaman:nowIso()}},[`Geri alındı: ${YON_T[u.y]} durumu ${durT(u.y,u.prev)}`]);}
  toast(`${list.length} değişiklik geri alındı`);
}
function bulkDur(items,k){
  const undo=[];
  for(const x of items){const r=setDur(x.p.id,x.y,k,{silent:true});if(r)undo.push(r);}
  if(undo.length)toast(`${undo.length} kişi: ${durT(items[0].y,k)}`,'',{label:'Geri al',fn:()=>undoDur(undo)});
  else toast('Değiştirilecek kişi yok');
}
function assignLegs(items,tid,why){
  const t=tid?S.trips.get(tid):null;let n=0;
  for(const x of items){
    const p=S.people.get(x.pid||x.p.id);if(!p||!p[x.y])continue;
    const cur=p[x.y].seferId||'';if(cur===(tid||''))continue;
    const from=cur&&S.trips.get(cur)?tripLabel(S.trips.get(cur)):'Atanmadı';
    updPerson(p,{[x.y]:{seferId:tid||''}},[`${YON_T[x.y]} aracı: ${from} → ${t?tripLabel(t):'Atanmadı'}${why?' ('+why+')':''}`]);n++;
  }
  return n;
}

/* ================= index, checks, suggestions ================= */
function legs(){const o=[];for(const p of S.people.values())for(const y of YON){if(p[y])o.push({p,y,L:p[y]});}return o;}
function allDays(){const s=new Set();for(const x of legs())if(x.L.tarih)s.add(x.L.tarih);for(const t of S.trips.values())if(t.tarih)s.add(t.tarih);return [...s].sort();}
function buildIndex(){
  const pax=new Map(),load=new Map();
  for(const p of S.people.values())for(const y of YON){const L=p[y];if(!L||!L.seferId||!rides(p,L))continue;if(!pax.has(L.seferId))pax.set(L.seferId,[]);pax.get(L.seferId).push({p,y,L});}
  for(const [id,a] of pax){a.sort((u,v)=>(u.L.saat||'').localeCompare(v.L.saat||'')||(u.p.kurum||'').localeCompare(v.p.kurum||'','tr')||u.p.ad.localeCompare(v.p.ad,'tr'));load.set(id,{n:a.length,m:a.reduce((s,x)=>s+misafir(x.L),0)});}
  S.idx={pax,load};
  S.sugg=suggest();
  S.issues=computeIssues();
}
const loadOf=id=>S.idx.load.get(id)||{n:0,m:0};
function slotsFor(day,y){
  const m=new Map();
  for(const p of S.people.values()){const L=p[y];if(!L||L.tarih!==day)continue;const k=L.saat||'';if(!m.has(k))m.set(k,{saat:k,items:[]});m.get(k).items.push({p,y,L});}
  const arr=[...m.values()].sort((a,b)=>(a.saat===''?1:0)-(b.saat===''?1:0)||a.saat.localeCompare(b.saat));
  for(const s of arr){
    s.items.sort((a,b)=>(a.p.kurum||'').localeCompare(b.p.kurum||'','tr')||a.p.ad.localeCompare(b.p.ad,'tr'));
    s.act=s.items.filter(x=>activeLeg(x.p,x.L));s.off=s.items.filter(x=>!activeLeg(x.p,x.L));
    s.n=s.act.length;s.m=s.act.reduce((a,x)=>a+misafir(x.L),0);
    s.openN=s.act.filter(isOpen).length;s.doneN=s.act.filter(x=>x.L.durum===DONE[y]).length;
    s.unassigned=s.act.filter(x=>rides(x.p,x.L)&&!(x.L.seferId&&S.trips.has(x.L.seferId)));
    s.tripIds=[...new Set(s.act.map(x=>x.L.seferId).filter(id=>id&&S.trips.has(id)))];
    s.lateN=s.saat&&overdue(day,s.saat,y)?s.act.filter(x=>x.L.durum==='bekliyor').length:0;s.late=s.lateN>0;
    s.key=day+'|'+y+'|'+s.saat;s.day=day;s.y=y;
  }
  return arr;
}
function suggest(){
  const slots=new Map();
  for(const {p,y,L} of legs()){
    if(!rides(p,L)||!L.saat||!L.tarih)continue;
    if(L.seferId&&S.trips.has(L.seferId))continue;
    const k=L.tarih+'|'+y+'|'+L.saat;
    if(!slots.has(k))slots.set(k,{k,tarih:L.tarih,y,saat:L.saat,items:[],need:0});
    const s=slots.get(k);s.items.push({pid:p.id,y,p,L});s.need+=1+misafir(L);
  }
  const rem=new Map();
  for(const t of S.trips.values()){if(t.durum==='iptal')continue;const l=loadOf(t.id);rem.set(t.id,(+t.kapasite||0)-l.n-l.m);}
  const pairs=[];
  for(const s of slots.values())for(const t of S.trips.values()){
    if(t.durum==='iptal'||t.tarih!==s.tarih||t.yon!==s.y||!t.saat)continue;
    const d=Math.abs(toMin(t.saat)-toMin(s.saat));if(d<=90)pairs.push({s,t,d});
  }
  pairs.sort((a,b)=>a.d-b.d||(+b.t.kapasite||0)-(+a.t.kapasite||0)||rem.get(b.t.id)-rem.get(a.t.id));
  for(const pr of pairs){if(pr.s.oneri)continue;if(rem.get(pr.t.id)>=pr.s.need){pr.s.oneri=pr.t.id;pr.s.fark=pr.d;rem.set(pr.t.id,rem.get(pr.t.id)-pr.s.need);}}
  return [...slots.values()].sort((a,b)=>(a.tarih+a.y+a.saat).localeCompare(b.tarih+b.y+b.saat));
}
function computeIssues(){
  const I=[];const add=(sev,type,title,sub,ref)=>I.push({sev,type,title,sub,ref});
  const seen=new Map();
  for(const p of S.people.values()){
    const nk=nameKey(p.ad);
    if(seen.has(nk))add('bad','tekrar','Aynı isimde iki kayıt',`${p.ad} — ${p.kurum||''}`,{k:'p',id:p.id});else seen.set(nk,p.id);
    if(p.katilim===false){
      for(const y of YON){const L=p[y];if(L&&L.seferId&&S.trips.has(L.seferId))add('bad','katilmayan','Katılmayacak kişi araca atanmış',`${p.ad} · ${YON_T[y]} ${tripLabel(S.trips.get(L.seferId))}`,{k:'p',id:p.id});}
      continue;
    }
    for(const y of YON){
      const L=p[y];
      if(!L){add('bad','bacak',`${YON_T[y]} kaydı yok`,`${p.ad} — ${p.kurum||''}`,{k:'p',id:p.id});continue;}
      if(L.durum==='iptal'||L.durum==='kendi')continue;
      if(!L.tarih)add('bad','tarih',`${YON_T[y]} tarihi girilmemiş`,p.ad,{k:'p',id:p.id});
      if(!L.saat)add('warn','saat',`${SAAT_T[y]} saati belirsiz`,`${p.ad} · ${YON_T[y]} ${trDate(L.tarih)}${L.not?' · '+L.not:''}`,{k:'p',id:p.id});
      if(L.durum==='gelmedi')add('bad','gelmedi',y==='gelis'?'Gelmedi olarak işaretli':'Dönüş aracına gelmedi',`${p.ad} · ${y==='gelis'?'dönüş kaydını ve konaklamayı kontrol edin':'havalimanına nasıl gittiğini teyit edin'}`,{k:'p',id:p.id});
      if(L.durum==='rotar')add('warn','rotar','Rötarlı uçuş',`${p.ad} · planlanan ${L.saat||'—'}${L.not?' · '+L.not:''}`,{k:'p',id:p.id});
      if(L.seferId){
        const t=S.trips.get(L.seferId);
        if(!t)add('bad','seferyok','Atandığı sefer silinmiş',`${p.ad} · ${YON_T[y]} ${trDate(L.tarih)} ${L.saat||''}`,{k:'p',id:p.id});
        else if(t.tarih!==L.tarih||t.yon!==y)add('bad','uyumsuz','Sefer tarihi veya yönü uyuşmuyor',`${p.ad} · kişi ${shortDate(L.tarih)} ${YON_T[y]}, sefer ${shortDate(t.tarih)} ${YON_T[t.yon]}`,{k:'p',id:p.id});
        else if(t.durum==='iptal'&&rides(p,L))add('bad','iptalsefer','İptal edilen sefere atanmış',`${p.ad} · ${tripLabel(t)}`,{k:'p',id:p.id});
        else if(L.saat&&t.saat){const d=Math.abs(toMin(t.saat)-toMin(L.saat));if(d>90)add('warn','saatfark','Sefer saati kişinin saatinden çok farklı',`${p.ad} · kişi ${L.saat}, sefer ${t.saat} (${d} dk)`,{k:'p',id:p.id});}
      }
    }
    if(p.gelis&&p.donus&&p.gelis.tarih&&p.donus.tarih&&activeLeg(p,p.gelis)&&activeLeg(p,p.donus)){
      if((p.donus.tarih+(p.donus.saat||'99'))<(p.gelis.tarih+(p.gelis.saat||'00')))add('bad','sira','Dönüş, gelişten önce görünüyor',`${p.ad} · geliş ${trDate(p.gelis.tarih)} ${p.gelis.saat||''}, dönüş ${trDate(p.donus.tarih)} ${p.donus.saat||''}`,{k:'p',id:p.id});
    }
  }
  for(const s of S.sugg){
    const t=s.oneri&&S.trips.get(s.oneri);
    add('warn','atanmadi','Araç atanmamış',`${shortDate(s.tarih)} ${YON_T[s.y]} ${s.saat} · ${s.items.length} kişi${s.need>s.items.length?' (+'+(s.need-s.items.length)+' misafir)':''}${t?' · öneri: '+tripLabel(t):' · uygun araç yok'}`,{k:'slot',d:s.tarih,y:s.y,saat:s.saat});
  }
  for(const d of allDays())for(const y of YON)for(const s of slotsFor(d,y)){if(s.late)add('bad','gecikti','Saati geçti, durum işaretlenmedi',`${shortDate(d)} ${YON_T[y]} ${s.saat} · ${s.lateN} kişi ${y==='gelis'?'karşılanmadı':'araca binmedi'}`,{k:'slot',d,y,saat:s.saat});}
  const eksik=[];
  for(const t of S.trips.values()){
    if(t.durum==='iptal')continue;
    const l=loadOf(t.id),tot=l.n+l.m,cap=+t.kapasite||0;
    if(cap&&tot>cap){const sib=[...S.trips.values()].filter(x=>x.id!==t.id&&x.tarih===t.tarih&&x.yon===t.yon&&x.durum!=='iptal'&&x.saat&&x.saat===t.saat);add('bad','kapasite','Kapasite aşıldı',`${shortDate(t.tarih)} ${YON_T[t.yon]} ${tripLabel(t)} · ${tot} kişi / ${cap} koltuk · ${sib.length?'aynı saatte '+sib.map(x=>ARAC_T[x.arac]||x.arac).join(', ')+' var, bölmek için dokunun':'bölmek için dokunun'}`,{k:'split',id:t.id});}
    if(tot===0)add('warn','bos','Yolcusu olmayan sefer',`${shortDate(t.tarih)} ${YON_T[t.yon]} ${tripLabel(t)}`,{k:'t',id:t.id});
    if(t.durum==='tamam'){const o=(S.idx.pax.get(t.id)||[]).filter(isOpen).length;if(o)add('warn','tamamacik','Sefer tamamlandı ama yolcu durumu açık',`${tripLabel(t)} · ${o} kişi`,{k:'t',id:t.id});}
    if(!t.plaka||!t.sofor)eksik.push(t);
  }
  if(eksik.length){eksik.sort((a,b)=>(a.tarih+a.saat).localeCompare(b.tarih+b.saat));add('info','aracbilgi','Plaka veya şoför bilgisi eksik',`${eksik.length} sefer · ilki ${shortDate(eksik[0].tarih)} ${tripLabel(eksik[0])}`,{k:'tab',t:'araclar'});}
  const ord={bad:0,warn:1,info:2};I.sort((a,b)=>ord[a.sev]-ord[b.sev]);
  return I;
}

function dayChips(sel,act,counter){
  return `<div class="days" role="group" aria-label="Gün seçimi">${allDays().map(d=>{const i=dayInfo(d);const c=counter?counter(d):'';return `<button class="day" data-a="${act}" data-d="${d}" aria-pressed="${d===sel}">${c!==''?`<i>${c}</i>`:''}<b>${i.num}</b><span>${i.mon.slice(0,3)} · ${i.wd.slice(0,3)}</span></button>`;}).join('')}</div>`;
}
function openCount(d){let n=0;for(const x of legs())if(x.L.tarih===d&&isOpen(x))n++;return n===0?'✓':n;}

/* ---------- AKIŞ ---------- */
function vAkis(){
  if(!ready())return loadingView();
  if(!S.people.size)return emptyDbView();
  const days=allDays();
  if(!S.day||!days.includes(S.day))S.day=days.includes(todayStr())?todayStr():(days.find(d=>d>todayStr())||days[0]);
  const cnt={};for(const y of YON)cnt[y]=slotsFor(S.day,y).reduce((a,s)=>a+s.n,0);
  if(!S.yonManual&&cnt[S.yon]===0){const o=S.yon==='gelis'?'donus':'gelis';if(cnt[o]>0)S.yon=o;}
  const slots=slotsFor(S.day,S.yon);
  const live=slots.filter(s=>s.n>0);const off=slots.flatMap(s=>s.off);
  let h=dayChips(S.day,'day',openCount);
  h+=`<div class="seg" role="group" aria-label="Yön">${YON.map(y=>`<button data-a="yon" data-y="${y}" aria-pressed="${S.yon===y}">${ic(y==='gelis'?'plane':'hotel')} ${YON_T[y]} <small>${cnt[y]}</small></button>`).join('')}</div>`;
  h+=boardHtml(S.day,S.yon,live);
  const un=live.reduce((a,s)=>a+s.unassigned.length,0);
  if(un)h+=`<button class="cta" data-a="sugg">${ic('wand')}<span><b>${un} kişi bu gün araca atanmamış</b><span class="small">Önerilen araçları gözden geçirip tek dokunuşla atayın</span></span>${ic('chev')}</button>`;
  if(!live.length)h+=`<div class="empty">${dayLong(S.day)} için ${YON_T[S.yon].toLocaleLowerCase('tr-TR')} transferi yok.</div>`;
  for(const s of live)h+=slotHtml(s);
  if(off.length)h+=`<div class="card"><div class="ihead" style="color:var(--muted)">${ic('info')} Transfer gerekmeyenler (${off.length})</div>${off.map(x=>personRow(x,true)).join('')}</div>`;
  return h;
}
function boardHtml(day,y,live){
  const isToday=day===todayStr();
  const n=live.reduce((a,s)=>a+s.n,0),m=live.reduce((a,s)=>a+s.m,0),done=live.reduce((a,s)=>a+s.doneN,0);
  const trips=[...S.trips.values()].filter(t=>t.tarih===day&&t.yon===y&&t.durum!=='iptal').length;
  if(isToday){
    const late=live.filter(s=>s.late);
    if(late.length){const s=late[0];const mm=Math.round((Date.now()-legTime(day,s.saat))/60000);const mins=mm>=60?`${Math.floor(mm/60)} sa ${mm%60}`:mm;
      return `<div class="board"><div class="lbl">Gecikmede · ${late.length} grup</div><div class="big red">${s.saat}</div><div class="txt"><b>${s.lateN} kişi</b> hâlâ ${y==='gelis'?'karşılanmadı':'araca binmedi'}<br>${mins} dk önce ${y==='gelis'?'indi':'binmesi gerekiyordu'}</div></div>`;}
    const nx=live.find(s=>s.saat&&s.openN>0);
    if(nx){const diff=Math.round((legTime(day,nx.saat)-Date.now())/60000);
      const when=diff>0?(diff>=60?`${Math.floor(diff/60)} sa ${diff%60} dk sonra`:`${diff} dk sonra`):'şimdi';
      return `<div class="board"><div class="lbl">Sıradaki ${y==='gelis'?'varış':'biniş'}</div><div class="big">${nx.saat}</div><div class="txt"><b>${nx.openN} kişi${nx.m?' +'+nx.m+' misafir':''}</b> · ${when}<br>${esc(kurumSummary(nx.act))}</div></div>`;}
    return `<div class="board"><div class="lbl">Bugün · ${YON_L[y]}</div><div class="big">${ic('check','ico" style="width:36px;height:36px')}</div><div class="txt"><b>Tüm transferler tamamlandı</b><br>${done}/${n} kişi</div></div>`;
  }
  const first=live.find(s=>s.saat);
  return `<div class="board"><div class="lbl">${dayLong(day)} · ${YON_L[y]}</div><div class="big">${first?first.saat:'--:--'}</div><div class="txt"><b>${n} kişi${m?' +'+m+' misafir':''}</b> · ${trips} araç seferi<br>${first?(y==='gelis'?'İlk varış':'İlk biniş')+' '+first.saat+' · ':''}${done} kişi tamamlandı</div></div>`;
}
function kurumSummary(items){const k=[...new Set(items.map(x=>x.p.kurum||''))];return k.length?(k[0]+(k.length>1?` +${k.length-1} kurum`:'')):'';}
function slotHtml(s){
  const open=S.open.has(s.key);
  const st=s.openN===0?'st-ok':s.late?'st-bad':s.unassigned.length?'st-warn':'';
  const pct=s.n?Math.round(s.doneN/s.n*100):0;
  const tchips=s.tripIds.map(id=>{const t=S.trips.get(id);const l=loadOf(id);const over=(l.n+l.m)>(+t.kapasite||0);return `<span class="chip ${over?'bad':'pend'} veh">${ic('van')}${esc(tripLabel(t))}</span>`;}).join(' ');
  const warn=s.unassigned.length?`<span class="chip warn">${ic('alert')}${s.unassigned.length} kişi araçsız</span>`:'';
  const late=s.late?`<span class="chip bad">Saati geçti</span>`:'';
  let h=`<section class="card slot ${st}"><button class="slot-head" data-a="slot" data-k="${esc(s.key)}" aria-expanded="${open}">
    <div class="time">${s.saat||'--:--'}<small>${SAAT_T[s.y]}</small></div>
    <div class="slot-main"><div class="slot-title">${s.n} kişi${s.m?` <span class="muted">+${s.m} misafir</span>`:''}</div><div class="slot-kurum">${esc(kurumSummary(s.act))}</div><div class="row">${tchips}${warn}${late}</div></div>
    <div class="prog">${s.doneN}/${s.n}<div class="bar"><i style="width:${pct}%"></i></div>${ic(open?'down':'chev')}</div></button>`;
  if(open){
    h+=s.act.map(x=>personRow(x,false)).join('');
    const opens=s.act.filter(isOpen);
    const tools=[];
    if(S.canWrite&&opens.length){
      for(const k of BULK[s.y]){const cand=opens.filter(x=>FLOW[s.y].indexOf(x.L.durum)<FLOW[s.y].indexOf(k));if(cand.length)tools.push(`<button class="btn sm" data-a="bulk" data-k="${esc(s.key)}" data-s="${k}">${ic('check')} Hepsi: ${durT(s.y,k)} (${cand.length})</button>`);}
    }
    if(S.canWrite)tools.push(`<button class="btn sm" data-a="assign" data-k="${esc(s.key)}">${ic('van')} Araç ata</button>`);
    tools.push(`<button class="btn sm" data-a="copyslot" data-k="${esc(s.key)}">${ic('copy')} Listeyi gönder</button>`);
    h+=`<div class="slot-tools">${tools.join('')}</div>`;
  }
  return h+'</section>';
}
function personRow(x,offList){
  const {p,y,L}=x;const c=p.katilim===false?'mute':durC(y,L.durum);
  const t=L.seferId&&S.trips.get(L.seferId);
  let act='';
  if(p.katilim===false)act=`<span class="act mute">Katılmayacak</span>`;
  else if(L.durum===DONE[y])act=`<span class="act done">${ic('check')}${L.durumZaman?hm(L.durumZaman):'Tamam'}</span>`;
  else if(L.durum==='gelmedi')act=`<span class="act bad">${durT(y,L.durum)}</span>`;
  else if(L.durum==='kendi'||L.durum==='iptal')act=`<span class="act mute">${durT(y,L.durum)}</span>`;
  else if(NEXT[y][L.durum]&&S.canWrite)act=`<button class="act" data-a="next" data-p="${p.id}" data-y="${y}">${NEXT[y][L.durum][1]}</button>`;
  else act=`<span class="chip ${c}">${durT(y,L.durum)}</span>`;
  const sub=[];
  if(offList&&L.saat)sub.push(L.saat);
  sub.push(esc(p.kurum||''));
  if(p.gorev)sub.push(esc(p.gorev));
  if(!offList){
    if(t)sub.push(`<span class="chip veh pend">${esc(tripLabel(t))}</span>`);else if(rides(p,L))sub.push(`<span class="chip warn">Araçsız</span>`);
    if(L.durum==='karsilandi'||L.durum==='bindi'||L.durum==='rotar')sub.push(`<span class="chip ${durC(y,L.durum)}">${durT(y,L.durum)}${L.durumZaman?' '+hm(L.durumZaman):''}</span>`);
  }
  if(L.not)sub.push(`<span class="chip">${esc(L.not)}</span>`);
  return `<div class="prow"><span class="dot ${c}"></span><div><button class="pname" data-a="person" data-p="${p.id}">${esc(p.ad)}${misafir(L)?` <span class="muted">+${misafir(L)} misafir</span>`:''}</button><div class="psub">${sub.join('<span aria-hidden="true">·</span>')}</div></div>${act}</div>`;
}

function vAraclar(){
  if(!ready())return loadingView();
  if(!S.people.size&&!S.trips.size)return emptyDbView();
  const days=allDays();
  if(!S.tday||(S.tday!=='tum'&&!days.includes(S.tday)))S.tday=S.day&&days.includes(S.day)?S.day:(days[0]||'tum');
  let h=`<div class="row between"><h2 class="sec-h" style="margin:0">Araç seferleri</h2>${S.canWrite?`<button class="btn sm primary" data-a="newtrip">${ic('plus')} Yeni sefer</button>`:''}</div>`;
  h+=dayChips(S.tday,'tday',d=>[...S.trips.values()].filter(t=>t.tarih===d&&t.durum!=='iptal').length||'');
  const trips=[...S.trips.values()].filter(t=>t.tarih===S.tday).sort((a,b)=>(a.saat||'').localeCompare(b.saat||'')||a.arac.localeCompare(b.arac));
  const cnt=c=>trips.filter(t=>t.arac===c&&t.durum!=='iptal').length;
  h+=`<div class="row">${ARAC.filter(a=>cnt(a)).map(a=>`<span class="chip veh">${ARAC_T[a]} × ${cnt(a)}</span>`).join('')||'<span class="muted small">Bu gün sefer yok</span>'}</div>`;

  }
  return h;
}
function tripCard(t){
  const l=loadOf(t.id),tot=l.n+l.m,cap=+t.kapasite||0,over=cap&&tot>cap;
  const d=tdurOf(t.durum);
  const pct=cap?Math.min(100,Math.round(tot/cap*100)):0;
  const meta=[YON_L[t.yon]];if(t.plaka)meta.push(esc(t.plaka));if(t.sofor)meta.push(esc(t.sofor));
  return `<button class="trip" data-a="trip" data-t="${t.id}" style="${t.durum==='iptal'?'opacity:.55':''}"><div class="time">${t.saat||'--:--'}<small>Sefer</small></div>
   <div style="display:grid;gap:5px;min-width:0"><div class="row"><span class="chip veh pend">${ARAC_T[t.arac]||t.arac}</span><span class="chip ${d[2]}">${d[1]}</span>${!t.plaka||!t.sofor?'<span class="chip info">Plaka/şoför yok</span>':''}</div><div class="meta">${meta.join(' · ')}</div></div>
   <div><div class="load ${over?'over':''}">${tot}/${cap}</div><div class="bar load ${over?'over':''}" style="margin-top:4px"><i style="width:${pct}%"></i></div></div></button>`;
}

/* ---------- KİŞİLER ---------- */
const FILTS=[['tumu','Tümü'],['bekleyen','Bekleyen'],['aracsiz','Araçsız'],['sorunlu','Sorunlu'],['tamam','Tamamlanan'],['katilmayan','Katılmayacak']];
function pfilter(p,f,probIds){
  const xs=YON.map(y=>({p,y,L:p[y]})).filter(x=>x.L);
  switch(f){
    case 'bekleyen':return p.katilim!==false&&xs.some(isOpen);
    case 'aracsiz':return p.katilim!==false&&xs.some(x=>rides(p,x.L)&&!(x.L.seferId&&S.trips.has(x.L.seferId)));
    case 'sorunlu':return probIds.has(p.id);
    case 'tamam':return p.katilim!==false&&xs.length===2&&!xs.some(isOpen);
    case 'katilmayan':return p.katilim===false;
    default:return true;
  }
}
function vKisiler(){
  if(!ready())return loadingView();
  if(!S.people.size&&!S.trips.size)return emptyDbView();
  const probIds=new Set(S.issues.filter(i=>i.sev!=='info'&&i.ref.k==='p').map(i=>i.ref.id));
  const all=[...S.people.values()];
  const q=fold(S.q);
  const list=all.filter(p=>pfilter(p,S.filt,probIds)&&(!q||fold(p.ad+' '+(p.kurum||'')+' '+(p.gorev||'')+' '+(p.tel||'')).includes(q)))
    .sort((a,b)=>(a.kurum||'').localeCompare(b.kurum||'','tr')||a.ad.localeCompare(b.ad,'tr'));
  let h=`<div class="search"><div class="row" style="flex-wrap:nowrap"><input id="kq" class="inp" type="search" placeholder="İsim, kurum veya görev ara" value="${esc(S.q)}" aria-label="Kişi ara" autocomplete="off">${S.canWrite?`<button class="btn" data-a="newperson" aria-label="Kişi ekle">${ic('plus')}</button>`:''}</div>
   <div class="filters" role="group" aria-label="Filtre">${FILTS.map(([k,t])=>`<button class="fbtn" data-a="filt" data-f="${k}" aria-pressed="${S.filt===k}">${t} ${all.filter(p=>pfilter(p,k,probIds)).length}</button>`).join('')}</div></div>`;
  if(!list.length)return h+`<div class="empty">Eşleşen kişi yok.</div>`;
  h+=`<div class="small muted">${list.length} kişi${list.reduce((a,p)=>a+Math.max(misafir(p.gelis),misafir(p.donus)),0)?' · '+list.reduce((a,p)=>a+Math.max(misafir(p.gelis),misafir(p.donus)),0)+' misafir':''}</div><div class="card">`;
  let lastK=null;
  for(const p of list){
    if(p.kurum!==lastK){lastK=p.kurum;h+=`<div class="kgroup">${esc(p.kurum||'Kurum belirtilmemiş')}</div>`;}

}
function legPill(p,y){
  const L=p[y];const lab=y==='gelis'?'G':'D';
  if(!L)return `<span class="lp bad">${lab} yok</span>`;
  let c=p.katilim===false?'mute':durC(y,L.durum);
  if(c==='pend'&&rides(p,L)&&!(L.seferId&&S.trips.has(L.seferId)))c='warn';
  return `<span class="lp ${c}" title="${YON_T[y]}: ${esc(durT(y,L.durum))}">${lab} ${shortDate(L.tarih)} ${L.saat||'—'}</span>`;
}

/* ---------- KONTROL ---------- */
function vKontrol(){

  let h=`<div class="kpis"><div class="kpi bad"><b>${c('bad')}</b><span>Kritik</span></div><div class="kpi warn"><b>${c('warn')}</b><span>Uyarı</span></div><div class="kpi info"><b>${c('info')}</b><span>Bilgi</span></div></div>`;

  if(un&&S.canWrite)h+=`<button class="cta" data-a="sugg">${ic('wand')}<span><b>${S.sugg.length} saat grubunda ${un} kişi araca atanmamış</b><span class="small">Saati en yakın, yeri olan araç önerildi. Gözden geçirip onaylayın.</span></span>${ic('chev')}</button>`;
  if(!I.length)return h+`<div class="panel"><h3 style="color:var(--ok)">${ic('check')} Her şey yolunda</h3><p class="muted" style="margin:0">Eksik kayıt, araçsız yolcu, kapasite aşımı veya geciken transfer yok.</p></div>`;
  const groups=new Map();
  for(const i of I){const k=i.sev+'|'+i.type+'|'+i.title;if(!groups.has(k))groups.set(k,{sev:i.sev,title:i.title,items:[]});groups.get(k).items.push(i);}
  for(const g of groups.values()){
    h+=`<div class="card"><div class="ihead ${g.sev}">${ic(g.sev==='info'?'info':'alert')} ${esc(g.title)} <span class="chip ${g.sev}" style="margin-left:auto">${g.items.length}</span></div>`;

    h+='</div>';
  }
  h+=`<p class="small muted" style="margin:0">Kontroller her değişiklikte ve dakikada bir yeniden yapılır. Geliş için uçuş saatinden ${graceMin('gelis')} dk, dönüş için biniş saatinden ${graceMin('donus')} dk sonra hâlâ “Bekleniyor” durumundaki kişiler “Saati geçti” olarak listelenir ve telefona bildirim gelir.</p>`;
  return h;
}

/* ---------- ÖZET ---------- */
function vOzet(){
  if(!ready())return loadingView();
  const ps=[...S.people.values()];const act=ps.filter(p=>p.katilim!==false);
  const mis=act.reduce((a,p)=>a+Math.max(misafir(p.gelis),misafir(p.donus)),0);
  const L=legs();const actL=L.filter(x=>activeLeg(x.p,x.L));
  const dn=y=>actL.filter(x=>x.y===y&&x.L.durum===DONE[y]).length,tn=y=>actL.filter(x=>x.y===y).length;
  const trips=[...S.trips.values()].filter(t=>t.durum!=='iptal');
  let h=`<div class="stats"><div class="kpi"><b>${act.length}</b><span>Katılımcı${mis?` · +${mis} misafir`:''}</span></div><div class="kpi ${dn('gelis')===tn('gelis')&&tn('gelis')?'ok':''}"><b>${dn('gelis')}/${tn('gelis')}</b><span>Geliş tamamlandı</span></div><div class="kpi ${dn('donus')===tn('donus')&&tn('donus')?'ok':''}"><b>${dn('donus')}/${tn('donus')}</b><span>Dönüş tamamlandı</span></div><div class="kpi"><b>${trips.length}</b><span>Araç seferi</span></div></div>`;
  // per day
  const rows=[];
  for(const d of allDays())for(const y of YON){
    const xs=actL.filter(x=>x.L.tarih===d&&x.y===y);const ts=trips.filter(t=>t.tarih===d&&t.yon===y);
    if(!xs.length&&!ts.length)continue;
    const c=a=>ts.filter(t=>t.arac===a).length;
    rows.push({d,y,n:xs.length,m:xs.reduce((a,x)=>a+misafir(x.L),0),v:c('VİTO'),c:c('CRAFTER'),o:c('OTOBÜS'),x:c('DİĞER'),done:xs.filter(x=>x.L.durum===DONE[y]).length});
  }
  const sum=k=>rows.reduce((a,r)=>a+r[k],0);
  h+=`<div class="panel"><h3>Gün gün transferler</h3><div class="tw"><table><thead><tr><th>Tarih</th><th>Yön</th><th class="n">Kişi</th><th class="n">Misafir</th><th class="n">Vito</th><th class="n">Crafter</th><th class="n">Otobüs</th><th class="n">Biten</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${trDate(r.d)}</td><td>${YON_T[r.y]}</td><td class="n">${r.n}</td><td class="n">${r.m||'–'}</td><td class="n">${r.v||'–'}</td><td class="n">${r.c||'–'}</td><td class="n">${r.o||'–'}</td><td class="n">${r.done}/${r.n}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">Toplam</td><td class="n">${sum('n')}</td><td class="n">${sum('m')}</td><td class="n">${sum('v')}</td><td class="n">${sum('c')}</td><td class="n">${sum('o')}</td><td class="n">${sum('done')}/${sum('n')}</td></tr></tfoot></table></div></div>`;
  // excel-like summary per direction
  for(const y of YON){
    const ds=[...new Set(trips.filter(t=>t.yon===y).map(t=>t.tarih))].sort();if(!ds.length)continue;
    const range=ds.length>1?`${ds[0].slice(8,10)}–${trDate(ds[ds.length-1])}`:trDate(ds[0]);
    h+=`<div class="panel"><h3>${range} ${YON_SHEET[y]} arası transferler</h3><div class="tw"><table><thead><tr><th>Araç model</th><th>Kapasite</th><th class="n">Toplam transfer (tek yön)</th></tr></thead><tbody>${ARAC.filter(a=>a!=='DİĞER'||trips.some(t=>t.arac===a&&t.yon===y)).map(a=>{const n=trips.filter(t=>t.yon===y&&t.arac===a).length;return `<tr><td>${a==='VİTO'?'TRANSPORTER/VİTO':a==='CRAFTER'?'CRAFTER/MERCEDES':a}</td><td>${a==='VİTO'?'9 KİŞİ':a==='CRAFTER'?'10-19 KİŞİ':a==='OTOBÜS'?'20-28':capOf(a)}</td><td class="n"><b>${n||'–'}</b></td></tr>`;}).join('')}</tbody></table></div></div>`;
  }
  // kurum
  const kc=new Map();for(const p of act){kc.set(p.kurum||'—',(kc.get(p.kurum||'—')||0)+1);}
  h+=`<details class="panel"><summary style="font-weight:700;cursor:pointer">Kurumlara göre katılımcı (${kc.size} kurum)</summary><div class="tw"><table><tbody>${[...kc].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'tr')).map(([k,n])=>`<tr><td style="white-space:normal">${esc(k)}</td><td class="n">${n}</td></tr>`).join('')}</tbody></table></div></details>`;
  // data ops
  const im=S.meta.sonIceAktarma;const bc=S.meta.bildirim||{};const bOn=bc.on!==false;const lead=+bc.lead||30;
  h+=`<div class="panel"><h3>${ic('alert')} Bildirimler</h3>
    <label class="toggle"><input type="checkbox" id="b_on" ${bOn?'checked':''}> Uçuş varışı ve otelden biniş öncesi uyar</label>
    <div class="field"><label for="b_lead">Ne kadar önce</label><select id="b_lead">${[15,30,45,60,90].map(m=>`<option value="${m}" ${m===lead?'selected':''}>${m} dakika önce</option>`).join('')}</select></div>
    <p class="small muted" style="margin:0">Her saat grubu için önceden bir uyarı gelir. Grup ${graceMin('gelis')} dk sonra (dönüşte ${graceMin('donus')} dk) hâlâ “Bekleniyor” ise ikinci uyarı gelir. İşaretlediğiniz gruplar için uyarı gelmez.</p>
    <div id="b_durum" class="small" style="display:grid;gap:6px"></div>
    <div class="row"><button class="btn sm" data-a="btest">Deneme bildirimi (1 dk sonra)</button></div></div>`;
  h+=`<div class="panel"><h3>Kayıtlar ve Excel</h3>
    <p class="small muted" style="margin:0">Kayıtlar bu telefonda tutulur. Gün sonunda “Yedek al” ile bir kopyasını WhatsApp'ta kendinize gönderin; telefon değişirse ya da uygulama silinirse yedekten geri yüklersiniz.</p>
    <div class="g2"><button class="btn" data-a="export">${ic('dl')} Excel olarak al</button><button class="btn" data-a="import">${ic('ul')} Excel'den güncelle</button></div>
    <div class="g2"><button class="btn" data-a="backup">${ic('dl')} Yedek al</button><button class="btn" data-a="restore">${ic('ul')} Yedekten yükle</button></div>
    <p class="small muted" style="margin:0">${im?`Son Excel aktarımı: ${esc(im.dosya||'')} · ${fmtTime(im.t)}`:''}</p></div>`;
  h+=`<p class="small muted" style="margin:0;text-align:center">Antalya Transfer ${esc(appVer())}</p>`;
  return h;
}

function openSheet(s,dirty=false){S.sheet=s;S.dirty=dirty;$('#sheetWrap').hidden=false;document.body.style.overflow='hidden';renderSheet(true);}
function closeSheet(){S.sheet=null;S.dirty=false;$('#sheetWrap').hidden=true;$('#sheet').innerHTML='';document.body.style.overflow='';render();}
function renderSheet(first){
  const el=$('#sheet');const st=first?0:el.scrollTop;
  const s=S.sheet;if(!s)return;
  const f=SHEETS[s.type];if(!f){closeSheet();return;}
  const out=f(s);if(out==null){closeSheet();return;}
  const ae=document.activeElement;const fid=!first&&ae&&ae.id&&el.contains(ae)?ae.id:null;
  el.innerHTML=out;el.scrollTop=st;
  if(fid){const x=document.getElementById(fid);if(x)x.focus({preventScroll:true});}
  if(first){const x=el.querySelector('.x');if(x)x.focus({preventScroll:true});}
  if(s.type==='person')fillNames(s.id);
  if(s.type==='assign')renderAssignPrev();
}

assign(s){
  const items=s.items.map(x=>({...x,p:S.people.get(x.pid)})).filter(x=>x.p&&x.p[x.y]);
  const need=items.reduce((a,x)=>a+1+misafir(x.p[x.y]),0);
  const ts=[...S.trips.values()].filter(t=>t.tarih===s.tarih&&t.yon===s.yon&&t.durum!=='iptal').map(t=>({t,d:s.saat&&t.saat?Math.abs(toMin(t.saat)-toMin(s.saat)):9999})).sort((a,b)=>a.d-b.d);
  const cur=new Set(s.pre||items.map(x=>x.p[x.y].seferId).filter(id=>id&&S.trips.has(id)));
  const def=need>19?'OTOBÜS':need>9?'CRAFTER':'VİTO';
  let h=head('Araç ata',`${shortDate(s.tarih)} ${YON_T[s.yon]} ${s.saat||''} · ${items.length} kişi${need>items.length?' +'+(need-items.length)+' misafir = '+need+' yer':''}`)+'<div class="sheet-body">';
  const row=({t,d})=>{const l=loadOf(t.id);return `<label class="check"><input type="checkbox" data-as="${t.id}" ${cur.has(t.id)?'checked':''}><span><b>${esc(tripLabel(t))}</b><br><span class="small muted">${d<9999?(d===0?'Aynı saat':d+' dk fark')+' · ':''}şu an ${l.n+l.m}/${t.kapasite}</span></span><span></span></label>`;};
  const near=ts.filter(x=>x.d<=90||cur.has(x.t.id)),far=ts.filter(x=>!(x.d<=90||cur.has(x.t.id)));
  h+=`<div class="note info">${ic('info')} İki ya da daha fazla araç işaretlerseniz kişiler kapasiteye göre araçlara bölünür; aynı kurumdan gelenler bir arada kalır.</div><div class="card">`;
  h+=near.map(row).join('');
  h+=`<div class="check"><span>${ic('plus')}</span><span><b>Yeni araç ekle</b><br><span class="small muted">Saat ${s.saat||'—'}</span></span><span class="row" style="flex-wrap:nowrap"><select id="as_n" aria-label="Kaç araç">${[0,1,2,3].map(k=>`<option value="${k}" ${k===(ts.length?0:1)?'selected':''}>${k}</option>`).join('')}</select><select id="as_arac" aria-label="Araç tipi">${ARAC.map(a=>`<option value="${a}" ${a===def?'selected':''}>${ARAC_T[a]} (${capOf(a)})</option>`).join('')}</select></span></div></div>`;
  if(far.length)h+=`<details class="card"><summary class="ihead" style="cursor:pointer">Diğer seferler bu gün <span class="chip" style="margin-left:auto">${far.length}</span>${ic('down')}</summary>${far.map(row).join('')}</details>`;
  h+=`<div class="panel"><h3>Dağılım</h3><div id="as_prev" class="small"></div></div>`;
  h+=`<details class="panel"><summary style="cursor:pointer;font-weight:700">Kişiler (${items.length})</summary><div class="small">${items.map(x=>esc(x.p.ad)+(misafir(x.p[x.y])?` (+${misafir(x.p[x.y])})`:'')).join(', ')}</div></details></div>`;
  h+=`<div class="sheet-foot"><button class="btn" data-a="unassign">Atamayı kaldır</button><button class="btn primary" data-a="doassign">Uygula</button></div>`;
  return h;
},
sugg(s){
  const list=S.sugg;
  if(!list.length)return head('Araç önerileri')+`<div class="sheet-body"><div class="panel"><h3 style="color:var(--ok)">${ic('check')} Araçsız yolcu kalmadı</h3></div></div>`;
  let h=head('Araç önerileri',`${list.length} saat grubu · ${list.reduce((a,x)=>a+x.items.length,0)} kişi`)+`<div class="sheet-body"><div class="note info">${ic('info')} Her grup için saati en yakın ve yeri olan sefer seçildi (en fazla 90 dk fark). Seçimi değiştirebilir veya işareti kaldırabilirsiniz. Uygun araç yoksa yeni sefer açın.</div><div class="card">`;
  let lastD='';
  for(const x of list){
    const dk=x.tarih+x.y;
    if(dk!==lastD){lastD=dk;h+=`<div class="kgroup">${dayLong(x.tarih)} · ${YON_T[x.y]}</div>`;}
    const ts=[...S.trips.values()].filter(t=>t.tarih===x.tarih&&t.yon===x.y&&t.durum!=='iptal').sort((a,b)=>Math.abs(toMin(a.saat)-toMin(x.saat))-Math.abs(toMin(b.saat)-toMin(x.saat)));
    h+=`<div class="srow"><input type="checkbox" data-sk="${esc(x.k)}" ${x.oneri?'checked':''} aria-label="${x.saat} grubunu uygula"><div><b class="disp" style="font-size:20px">${x.saat}</b> <span class="small"><b>${x.items.length} kişi</b>${x.need>x.items.length?' +'+(x.need-x.items.length)+' misafir':''}</span> <span class="small muted">· ${esc(kurumSummary(x.items))}</span>${x.oneri?'':`<div class="small" style="color:var(--warn)">Tek araca sığmıyor ya da yakın araç yok.</div><button class="btn sm" style="margin-top:6px" data-a="assign" data-k="${esc(x.k)}">${ic('van')} Birden fazla araca böl</button>`}</div>
      <select data-ss="${esc(x.k)}" aria-label="Sefer seçimi"><option value="">— seçin —</option>${ts.map(t=>{const l=loadOf(t.id);return `<option value="${t.id}" ${t.id===x.oneri?'selected':''}>${esc(tripLabel(t))} · ${l.n+l.m}/${t.kapasite} · ${Math.abs(toMin(t.saat)-toMin(x.saat))} dk</option>`;}).join('')}</select></div>`;
  }
  h+=`</div></div><div class="sheet-foot"><button class="btn" data-a="close">Vazgeç</button><button class="btn primary" data-a="applysugg">Seçilenleri ata</button></div>`;

addpax(s){
  const t=S.trips.get(s.tid);if(!t)return null;
  const cands=[];
  for(const p of S.people.values()){const L=p[t.yon];if(!L||L.tarih!==t.tarih||!rides(p,L))continue;cands.push({p,L,d:L.saat&&t.saat?Math.abs(toMin(L.saat)-toMin(t.saat)):9999});}
  cands.sort((a,b)=>(a.L.seferId===t.id?0:1)-(b.L.seferId===t.id?0:1)||(a.L.seferId?1:0)-(b.L.seferId?1:0)||a.d-b.d||a.p.ad.localeCompare(b.p.ad,'tr'));
  let h=head('Yolcu ekle / çıkar',`${tripLabel(t)} · ${dayLong(t.tarih)} ${YON_T[t.yon]}`)+`<div class="sheet-body"><div class="note info">${ic('info')} İşaretli olanlar bu araçta olur. Başka araçtaki birini işaretlerseniz bu araca taşınır.</div><div class="card">`;
  h+=cands.map(({p,L,d})=>{const other=L.seferId&&L.seferId!==t.id&&S.trips.get(L.seferId);return `<label class="check"><input type="checkbox" data-pp="${p.id}" ${L.seferId===t.id?'checked':''}><span><b>${esc(p.ad)}</b>${misafir(L)?` <span class="muted">+${misafir(L)}</span>`:''}<br><span class="small muted">${L.saat||'—'} · ${esc(p.kurum||'')}</span></span>${other?`<span class="chip veh">${esc(tripLabel(other))}</span>`:L.seferId===t.id?'':'<span class="chip warn">Araçsız</span>'}</label>`;}).join('')||'<div class="empty">Bu tarih ve yönde kişi yok.</div>';
  h+=`</div></div><div class="sheet-foot"><button class="btn" data-a="close">Vazgeç</button><button class="btn primary" data-a="savepax" data-t="${t.id}">Kaydet</button></div>`;
  return h;

text(s){return head(esc(s.title||'Metin'))+`<div class="sheet-body"><p class="small muted" style="margin:0">Otomatik kopyalama bu görünümde engellendi. Metni seçip kopyalayın.</p><textarea id="cptxt" class="inp" style="min-height:300px;font-size:13px" readonly>${esc(s.text)}</textarea><button class="btn" data-a="selall">Tümünü seç</button></div>`;},
imp(s){

  if(!S.people.size){const nk=ch.filter(c=>c.kind==='yeni').length,nt=ch.filter(c=>c.kind==='sefer').length;h+=`<div class="panel"><h3>İlk aktarım</h3><p style="margin:0"><b>${nk} kişi</b> ve <b>${nt} araç seferi</b> eklenecek.</p></div>`;}

  if(!ch.length)h+=`<div class="panel"><h3 style="color:var(--ok)">${ic('check')} Fark yok</h3><p class="muted" style="margin:0">Dosyadaki kişiler, saatler, misafirler, notlar ve araç seferleri uygulamadakiyle aynı.</p></div>`;

  }

  if(ch.length)h+=`<div class="sheet-foot"><button class="btn" data-a="close">Vazgeç</button><button class="btn primary" data-a="applyimp">Seçilenleri uygula</button></div>`;
  return h;
},
impres(s){
  const lab={sefer:'yeni sefer',seferdegisti:'sefer değişti',seferkalkti:'sefer iptal',yeni:'yeni kişi',degisen:'kişi güncellendi',bacakkalkti:'transfer iptal',yok:'katılmayacak yapıldı'};

  if(s.aracsiz)h+=`<button class="cta" data-a="sugg">${ic('wand')}<span><b>${s.aracsiz} kişi henüz araca atanmamış</b><span class="small">Önerilen araçları gözden geçirip atayın</span></span>${ic('chev')}</button>`;
  h+=supheliHtml(s.supheli,true);
  h+=`</div><div class="sheet-foot"><button class="btn" data-a="close">Kapat</button><button class="btn primary" data-a="gokontrol">Kontrol’e git</button></div>`;

/* ================= dialogs, toast, copy ================= */
let toastT=0;
function toast(msg,cls='',action=null,ms){
  const t=$('#toast');clearTimeout(toastT);
  t.className='toast '+(cls||'');t.innerHTML=`<span>${esc(msg)}</span>`;
  if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{t.hidden=true;action.fn();};t.appendChild(b);}
  t.hidden=false;toastT=setTimeout(()=>{t.hidden=true;},ms||(action?6000:2800));
}
function ask(title,text,choices){
  return new Promise(res=>{
    const w=$('#dlg');
    w.innerHTML=`<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT">${esc(title)}</h2>${text?`<p>${esc(text)}</p>`:''}<div class="dlg-btns">${choices.map((c,i)=>`<button class="btn ${c.cls||''}" data-i="${i}">${esc(c.t)}</button>`).join('')}</div></div>`;
    w.hidden=false;
    w.onclick=e=>{const b=e.target.closest('[data-i]');if(b||e.target===w){w.hidden=true;w.onclick=null;res(b?choices[+b.dataset.i].v:null);}};
    const f=w.querySelector('[data-i]');if(f)f.focus();
  });
}
async function copyText(txt,title){
  if(NB){
    const r=await ask(title||'Liste',null,[{t:'WhatsApp ile gönder',v:'wa',cls:'primary'},{t:'Kopyala',v:'cp'},{t:'Başka uygulamayla paylaş',v:'sh'},{t:'Vazgeç',v:null}]);
    try{if(r==='wa')NB.shareWhatsApp(txt);else if(r==='cp'){NB.copyText(txt);toast('Kopyalandı');}else if(r==='sh')NB.shareText(txt);}catch(e){toast('Paylaşılamadı','bad');}
    return;
  }
  try{await navigator.clipboard.writeText(txt);toast('Panoya kopyalandı');}
  catch(e){openSheet({type:'text',title:title||'Listeyi kopyalayın',text:txt},true);}
}
function listText(title,items,extra){
  const n=items.length,m=items.reduce((a,x)=>a+misafir(x.L),0);
  const lines=[title];if(extra)lines.push(...extra);
  lines.push(`Toplam: ${n} kişi${m?` + ${m} misafir = ${n+m}`:''}`,'');
  items.forEach((x,i)=>lines.push(`${i+1}) ${x.L.saat||'--:--'} ${x.p.ad} — ${x.p.kurum||''}${misafir(x.L)?` (+${misafir(x.L)} misafir)`:''}${x.p.tel?' · '+x.p.tel:''}`));
  return lines.join('\n');
}

/* ================= actions ================= */
function findSlot(key){const [d,y,s]=key.split('|');return slotsFor(d,y).find(x=>x.saat===s);}
const ACT={
  tab:d=>{S.tab=d.t;try{if(location.hash!=='#'+d.t)location.hash=d.t;}catch(e){}render();window.scrollTo(0,0);},
  day:d=>{S.day=d.d;S.yonManual=false;render();},
  tday:d=>{S.tday=d.d;render();},
  yon:d=>{S.yon=d.y;S.yonManual=true;render();},
  slot:d=>{S.open.has(d.k)?S.open.delete(d.k):S.open.add(d.k);render();},
  next:d=>{const p=S.people.get(d.p);if(!p)return;const n=NEXT[d.y][p[d.y].durum];if(n)setDur(d.p,d.y,n[0]);},
  person:d=>openSheet({type:'person',id:d.p}),
  trip:d=>openSheet({type:'trip',id:d.t}),
  close:async()=>{if(S.dirty&&(S.sheet&&(S.sheet.type==='person'||S.sheet.type==='trip'))){const r=await ask('Kaydedilmemiş değişiklik var','Kapatırsanız yaptığınız düzenlemeler kaybolur.',[{t:'Kaydetmeden kapat',v:'y',cls:'danger'},{t:'Düzenlemeye dön',v:null}]);if(r!=='y')return;}closeSheet();},
  filt:d=>{S.filt=d.f;render();},
  bulk:d=>{const s=findSlot(d.k);if(!s)return;const fl=FLOW[s.y];bulkDur(s.act.filter(isOpen).filter(x=>fl.indexOf(x.L.durum)<fl.indexOf(d.s)),d.s);},
  tbulk:d=>{const t=S.trips.get(d.t);if(!t)return;const fl=FLOW[t.yon];bulkDur((S.idx.pax.get(t.id)||[]).filter(isOpen).filter(x=>fl.indexOf(x.L.durum)<fl.indexOf(d.s)),d.s);},
  assign:d=>{const s=findSlot(d.k);if(!s)return;openSheet({type:'assign',tarih:s.day,yon:s.y,saat:s.saat,items:s.act.filter(x=>rides(x.p,x.L)).map(x=>({pid:x.p.id,y:x.y}))},true);},
  doassign:()=>{
    const P=assignPlan();if(!P.trips.length){toast('En az bir araç işaretleyin ya da yeni araç ekleyin');return;}
    const idMap=new Map();
    for(const v of P.virt){const id=createTrip({tarih:v.tarih,yon:v.yon,saat:v.saat||'',arac:v.arac,kapasite:v.kapasite});if(!id)return;idMap.set(v.id,id);}
    const byTrip=new Map();
    for(const [w,tid] of P.plan){const real=idMap.get(tid)||tid;if(!byTrip.has(real))byTrip.set(real,[]);byTrip.get(real).push({pid:w.x.pid,y:w.x.y});}
    const multi=byTrip.size>1;let n=0;const parts=[];
    for(const [tid,arr] of byTrip){n+=assignLegs(arr,tid,multi?'araçlara bölündü':'');const t=S.trips.get(tid);parts.push(`${ARAC_T[t.arac]||t.arac} ${t.saat||''}: ${arr.length} kişi`);}
    closeSheet();toast(n?parts.join(' · '):'Değişiklik yok','',null,5000);
  },
  unassign:()=>{const s=S.sheet;if(!s)return;const n=assignLegs(s.items,'');closeSheet();toast(`${n} kişinin araç ataması kaldırıldı`);},
  split:d=>{const t=S.trips.get(d.t);if(!t)return;const pax=S.idx.pax.get(t.id)||[];
    const sib=[...S.trips.values()].filter(x=>x.id!==t.id&&x.tarih===t.tarih&&x.yon===t.yon&&x.durum!=='iptal'&&x.saat&&x.saat===t.saat).map(x=>x.id);
    openSheet({type:'assign',tarih:t.tarih,yon:t.yon,saat:t.saat,items:pax.map(x=>({pid:x.p.id,y:x.y})),pre:[t.id,...sib]},true);},
  sugg:()=>openSheet({type:'sugg'},true),
  applysugg:()=>{
    let n=0,g=0;
    for(const cb of $$('input[data-sk]')){if(!cb.checked)continue;const k=cb.dataset.sk;const sel=$$('select[data-ss]').find(x=>x.dataset.ss===k);const tid=sel&&sel.value;if(!tid)continue;const s=S.sugg.find(x=>x.k===k);if(!s)continue;n+=assignLegs(s.items,tid,'öneri onaylandı');g++;}
    closeSheet();toast(n?`${g} grup, ${n} kişi araçlara atandı`:'Atanacak seçim yok');
  },

function autoTrip(d,y,s){if(!d||!s)return '';const ts=[...S.trips.values()].filter(t=>t.tarih===d&&t.yon===y&&t.saat===s&&t.durum!=='iptal');return ts.length===1?ts[0].id:'';}
function createTrip(o){
  const id=newId('s');
  const doc={tarih:o.tarih,yon:o.yon,saat:o.saat||'',arac:o.arac,kapasite:+o.kapasite||capOf(o.arac),plaka:o.plaka||'',sofor:o.sofor||'',soforTel:o.soforTel||'',durum:'planli',not:o.not||'',kaynak:o.kaynak||'Uygulamadan eklendi',gecmis:[logE('Sefer oluşturuldu')],guncelleme:nowIso(),guncelleyen:S.uid||''};
  return enqueue({op:'set',path:'seferler/'+id,data:doc,label:'Yeni sefer'})?id:null;
}
async function setTripDur(tid,k){
  const t=S.trips.get(tid);if(!t||t.durum===k)return;
  const pax=(S.idx.pax.get(t.id)||[]).filter(isOpen);
  updTrip(t,{durum:k,durumZaman:nowIso()},[`Sefer durumu: ${tdurOf(t.durum)[1]} → ${tdurOf(k)[1]}`]);
  const fl=FLOW[t.yon];
  if(k==='yolda'&&pax.length){
    const step=STEP1[t.yon];const c=pax.filter(x=>fl.indexOf(x.L.durum)<fl.indexOf(step));
    if(c.length){const r=await ask('Araç yola çıktı',`${c.length} yolcu henüz “${durT(t.yon,step)}” işaretlenmedi. Hepsini işaretleyeyim mi?`,[{t:`Evet, ${c.length} kişiyi işaretle`,v:'y',cls:'primary'},{t:'Hayır, sadece sefer durumunu değiştir',v:null}]);if(r==='y')bulkDur(c,step);}
  }
  if(k==='tamam'&&pax.length){
    const r=await ask('Sefer tamamlandı',`${pax.length} yolcu henüz “${durT(t.yon,DONE[t.yon])}” işaretlenmedi. Hepsini işaretleyeyim mi?`,[{t:`Evet, ${pax.length} kişiyi işaretle`,v:'y',cls:'primary'},{t:'Hayır, sadece sefer durumunu değiştir',v:null}]);
    if(r==='y')bulkDur(pax,DONE[t.yon]);
  }
}
function savePerson(pid){
  const p=S.people.get(pid);if(!p)return;
  const v=id=>{const e=$('#'+id);return e?e.value.trim():null;};
  const patch={},msgs=[];
  const base=[['ad','f_ad','Ad soyad',up],['kurum','f_kurum','Kurum',up],['gorev','f_gorev','Görev',up],['tel','f_tel','Telefon',x=>x],['not','f_not','Genel not',x=>x]];
  for(const [k,id,lab,fn] of base){const nv=fn(v(id)||'');if(nv!==(p[k]||'')){if(k==='ad'&&!nv){toast('Ad boş olamaz','bad');return;}patch[k]=nv;msgs.push(`${lab}: ${p[k]||'—'} → ${nv||'—'}`);}}
  const kat=$('#f_katilim').checked;if(kat!==(p.katilim!==false)){patch.katilim=kat;msgs.push(kat?'Katılacak olarak işaretlendi':'Katılmayacak olarak işaretlendi');}
  for(const y of YON){
    const L=p[y];if(!L)continue;const pre=y==='gelis'?'g':'d';const lp={};
    const f=[['tarih','_tarih','tarihi',x=>x,trDate],['saat','_saat','saati',x=>x,x=>x],['seferId','_sefer','aracı',x=>x,x=>x&&S.trips.get(x)?tripLabel(S.trips.get(x)):'Atanmadı'],['ulasim','_ulasim','ulaşım türü',up,x=>x],['not','_not','notu',x=>x,x=>x]];
    for(const [k,suf,lab,fn,show] of f){const nv=fn(v(pre+suf)||'');if(nv!==(L[k]||'')){lp[k]=nv;msgs.push(`${YON_T[y]} ${lab}: ${show(L[k]||'')||'—'} → ${show(nv)||'—'}`);}}
    const nm=Math.max(0,parseInt(v(pre+'_misafir'),10)||0);if(nm!==misafir(L)){lp.misafir=nm;msgs.push(`${YON_T[y]} misafir: ${misafir(L)} → ${nm}`);}
    if((lp.tarih!=null||lp.saat!=null)&&lp.seferId==null&&L.seferId){const t=S.trips.get(L.seferId);const nd=lp.tarih??L.tarih;if(t&&t.tarih!==nd){lp.seferId='';msgs.push(`${YON_T[y]} aracı tarih değiştiği için kaldırıldı`);}}
    if(Object.keys(lp).length)patch[y]=lp;
  }
  if(!msgs.length){S.dirty=false;renderSheet();toast('Değişiklik yok');return;}
  if(updPerson(p,patch,msgs)){S.dirty=false;renderSheet();toast('Kaydedildi');}
}
function saveTrip(tid){
  const t=S.trips.get(tid);if(!t)return;
  const v=id=>$('#'+id).value.trim();const patch={},msgs=[];
  const f=[['tarih','t_tarih','Tarih',x=>x],['yon','t_yon','Yön',x=>x],['saat','t_saat','Saat',x=>x],['arac','t_arac','Araç',x=>x],['plaka','t_plaka','Plaka',up],['sofor','t_sofor','Şoför',x=>x],['soforTel','t_tel','Şoför tel',x=>x],['not','t_not','Not',x=>x]];
  for(const [k,id,lab,fn] of f){const nv=fn(v(id));if(nv!==(t[k]||'')){patch[k]=nv;msgs.push(`${lab}: ${t[k]||'—'} → ${nv||'—'}`);}}
  const kp=Math.max(1,parseInt(v('t_kap'),10)||capOf(patch.arac||t.arac));if(kp!==+t.kapasite){patch.kapasite=kp;msgs.push(`Kapasite: ${t.kapasite} → ${kp}`);}
  if(!msgs.length){S.dirty=false;renderSheet();toast('Değişiklik yok');return;}
  if(updTrip(t,patch,msgs)){S.dirty=false;renderSheet();toast('Kaydedildi');}
  if((patch.tarih||patch.yon)&&(S.idx.pax.get(t.id)||[]).length)toast('Tarih/yön değişti: yolcuların kayıtlarını Kontrol sekmesinden kontrol edin','bad',null,6000);
}

const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

function toB64(u8){let s='';const CH=0x8000;for(let i=0;i<u8.length;i+=CH)s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));return btoa(s);}
async function saveFile(name,data,mime){
  const bytes=typeof data==='string'?new TextEncoder().encode(data):(data instanceof Uint8Array?data:new Uint8Array(data));
  if(!NB){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Dosya hazır');}catch(e){toast('Dosya kaydedilemedi','bad');}return;}
  const r=await ask('Dosya hazır',name,[{t:'Telefona kaydet',v:'save',cls:'primary'},{t:'WhatsApp ile gönder',v:'whatsapp'},{t:'Başka uygulamayla paylaş (e-posta vb.)',v:'share'},{t:'Vazgeç',v:null}]);
  if(!r)return;
  try{const b64=toB64(bytes);if(r==='save')NB.saveFile(b64,name,mime);else NB.shareFile(b64,name,mime,'',r);}catch(e){toast('Dosya hazırlanamadı','bad');}
}
