const stamp=()=>{const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;};
function buildExportSheets(){
  const Hd=v=>({v,s:2});const sheets=[];
  const keys=[...new Set(legs().map(x=>x.L.tarih+'|'+x.y))].sort((a,b)=>{const [da,ya]=a.split('|'),[db,yb]=b.split('|');return da.localeCompare(db)||(ya==='gelis'?-1:1);});
  for(const k of keys){
    const [d,y]=k.split('|');
    const xs=legs().filter(x=>x.L.tarih===d&&x.y===y).sort((a,b)=>((a.L.saat||'99')).localeCompare(b.L.saat||'99')||(a.p.kurum||'').localeCompare(b.p.kurum||'','tr')||a.p.ad.localeCompare(b.p.ad,'tr'));
    const rows=[['S.N','KURUM/FAALİYET ALANI','PERSONEL İSMİ','GÖREV/UNVAN','TELEFON','ULAŞIM TÜRÜ',y==='gelis'?'GİRİŞ TARİHİ':'ÇIKIŞ TARİHİ',y==='gelis'?'ANTALYA VARIŞ SAATİ':'BİNİŞ SAATİ','MİSAFİR','ARAÇ','SEFER SAATİ','PLAKA','ŞOFÖR','ŞOFÖR TEL','DURUM','DURUM SAATİ','NOT'].map(Hd)];
    xs.forEach((x,i)=>{const t=x.L.seferId&&S.trips.get(x.L.seferId);rows.push([i+1,x.p.kurum||'',x.p.ad,x.p.gorev||'',x.p.tel||'',x.L.ulasim||'',trDate(x.L.tarih),x.L.saat||'-',misafir(x.L)||'',t?t.arac:'',t?t.saat:'',t?t.plaka||'':'',t?t.sofor||'':'',t?t.soforTel||'':'',x.p.katilim===false?'KATILMAYACAK':up(durT(x.y,x.L.durum)),x.L.durumZaman?fmtTime(x.L.durumZaman):'',[x.L.not,x.p.not].filter(Boolean).join(' / ')]);});
    sheets.push({name:`${trDate(d)} ${YON_SHEET[y]}`.slice(0,31),cols:[5,34,28,30,15,10,12,11,8,10,10,12,16,14,20,13,26],rows,freezeRow:1,filterRow:1,heights:[30]});
  }
  const ts=[...S.trips.values()].sort((a,b)=>(a.tarih+a.yon+a.saat).localeCompare(b.tarih+b.yon+b.saat));
  const ta=[['TARİH','YÖN','SAAT','ARAÇ','KAPASİTE','YOLCU','MİSAFİR','TOPLAM','PLAKA','ŞOFÖR','ŞOFÖR TEL','DURUM','NOT','YOLCULAR'].map(Hd)];
  for(const t of ts){const l=loadOf(t.id);ta.push([trDate(t.tarih),YON_SHEET[t.yon],t.saat,t.arac,+t.kapasite,l.n,l.m,l.n+l.m,t.plaka||'',t.sofor||'',t.soforTel||'',up(tdurOf(t.durum)[1]),t.not||'',{v:(S.idx.pax.get(t.id)||[]).map(x=>x.p.ad).join(', '),s:4}]);}
  sheets.push({name:'SEFERLER',cols:[12,18,8,10,9,7,8,8,12,16,14,12,20,80],rows:ta,freezeRow:1,filterRow:1,heights:[30]});
  const oa=[['TARİH','YÖN','KİŞİ','MİSAFİR','TRANSPORTER/VİTO','CRAFTER/MERCEDES','OTOBÜS','DİĞER','TAMAMLANAN'].map(Hd)];
  for(const d of allDays())for(const y of YON){const xs=legs().filter(x=>x.L.tarih===d&&x.y===y&&activeLeg(x.p,x.L));const tt=ts.filter(t=>t.tarih===d&&t.yon===y&&t.durum!=='iptal');if(!xs.length&&!tt.length)continue;const c=a=>tt.filter(t=>t.arac===a).length;oa.push([trDate(d),YON_SHEET[y],xs.length,xs.reduce((a,x)=>a+misafir(x.L),0),c('VİTO'),c('CRAFTER'),c('OTOBÜS'),c('DİĞER'),xs.filter(x=>x.L.durum===DONE[y]).length]);}
  sheets.push({name:'ÖZET',cols:[12,18,7,9,17,17,8,7,12],rows:oa,freezeRow:1,heights:[30]});
  const ia=[['ÖNEM','KONU','AYRINTI'].map(Hd)].concat(S.issues.map(i=>[{bad:'KRİTİK',warn:'UYARI',info:'BİLGİ'}[i.sev],i.title,i.sub]));
  sheets.push({name:'KONTROL',cols:[9,40,80],rows:ia,freezeRow:1,heights:[30]});
  return sheets;
}
async function exportXlsx(){

  catch(e){toast('Excel hazırlanamadı: '+((e&&e.message)||''),'bad');}
}
async function backupJson(){

async function restoreBackup(buf,name){
  let d;try{d=JSON.parse(new TextDecoder('utf-8').decode(buf));}catch(e){toast('Yedek dosyası okunamadı','bad');return;}
  const ks=Array.isArray(d&&d.kisiler)?d.kisiler:[],ts=Array.isArray(d&&d.seferler)?d.seferler:[];
  if(!ks.length){toast('Bu dosyada kişi kaydı yok','bad');return;}
  const r=await ask('Yedek geri yüklensin mi?',`${name}: ${ks.length} kişi, ${ts.length} sefer${d.olusturma?' ('+fmtTime(d.olusturma)+')':''}. Telefondaki mevcut kayıtların yerine geçer.`,[{t:'Geri yükle',v:'y',cls:'danger'},{t:'Vazgeç',v:null}]);
  if(r!=='y')return;
  const toMap=a=>Object.fromEntries(a.filter(x=>x&&x.id).map(x=>{const o=Object.assign({},x);delete o.id;return [x.id,o];}));
  window.YEREL.replaceAll({kisiler:toMap(ks),seferler:toMap(ts),meta:{ayarlar:Object.assign({},d.meta||{})}});

    const legs=YON.filter(y=>p[y]&&activeLeg(p,p[y]));const cov=legs.map(y=>parsed.cover.has(p[y].tarih+'|'+y));
    if(!cov.some(Boolean))continue;
    const started=legs.some(y=>STARTED.includes(p[y].durum));
    ch.push({kind:'yok',pid:p.id,text:p.ad,sub:`${p.kurum||''} · yeni listede yok → katılmayacak olarak işaretlenir (silinmez)${cov.every(Boolean)?'':' · dosyada bu kişinin bazı günleri yok'}${started?' · uygulamada transferi başlamış':''}`,checked:cov.every(Boolean)&&!started});
  }
  return {ch,supheli};
}
document.getElementById('fileIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{
    toast('Dosya okunuyor…');
    const buf=await f.arrayBuffer();const u8=new Uint8Array(buf);
    if(u8[0]===0x7B||/\.json$/i.test(f.name)){await restoreBackup(buf,f.name);return;}
    if(!(u8[0]===0x50&&u8[1]===0x4B)){toast('Bu dosya bir Excel (.xlsx) dosyası değil. Eski .xls dosyasını Excel’de .xlsx olarak kaydedin.','bad',null,8000);return;}
    const parsed=parseSheets(await readWorkbookRows(buf));
    if(!parsed.people.size){toast('Dosyada transfer listesi bulunamadı. Sayfa adları “20.11.2026 HAVALİMANI-OTEL” gibi olmalı ve bir “PERSONEL İSMİ / AD SOYAD” sütunu bulunmalı.','bad',null,9000);return;}
    const d=diffImport(parsed);
    openSheet({type:'imp',dosya:f.name,parsed,ch:d.ch,supheli:parsed.supheli.concat(d.supheli),sheets:parsed.sheets,warnings:parsed.warnings},true);
  }catch(err){toast('Dosya okunamadı: '+(err&&err.message||''),'bad',null,7000);}
});
function applyImport(){
  const s=S.sheet;if(!s)return;const sel=new Set($$('input[data-ci]').filter(c=>c.checked).map(c=>+c.dataset.ci));
  let n=0;const cnt={},bump=k=>{cnt[k]=(cnt[k]||0)+1;n++;};const keyOf=(d,y,sa)=>[d,y,sa].join('|');
  const local=new Map([...S.trips.values()].filter(t=>t.durum!=='iptal').map(t=>[t.id,Object.assign({},t)]));
  const newKeys=new Set(),freed=[];
  for(const [i,c] of s.ch.entries()){
    if(!sel.has(i))continue;
    if(c.kind==='sefer'){const id=createTrip(Object.assign({},c.t,{kaynak:c.t.kaynak+' (Excel güncellemesi)'}));if(id){local.set(id,Object.assign({id,durum:'planli'},c.t));newKeys.add(keyOf(c.t.tarih,c.t.yon,c.t.saat));bump('sefer');}}
    else if(c.kind==='seferdegisti'){const t=S.trips.get(c.tid);if(!t)continue;updTrip(t,c.patch,c.msgs);const lt=local.get(t.id);if(lt)Object.assign(lt,c.patch);newKeys.add(keyOf(t.tarih,t.yon,c.patch.saat||t.saat));bump('seferdegisti');}
    else if(c.kind==='seferkalkti'){const t=S.trips.get(c.tid);if(!t)continue;updTrip(t,{durum:'iptal'},[`Excel güncellemesinde bu araç yok: sefer iptal edildi (${s.dosya})`]);local.delete(t.id);for(const x of (S.idx.pax.get(t.id)||[]))freed.push(x);bump('seferkalkti');}
  }
  const pend=new Map();
  const want=(view,y,kurum,set)=>{if(!view||view.durum!=='bekliyor'||!view.tarih||!view.saat)return;const k=keyOf(view.tarih,y,view.saat);if(!pend.has(k))pend.set(k,[]);pend.get(k).push({n:1+misafir(view),kurum:kurum||'',set});};
  const newDocs=[],patches=[],legOff=[],gone=[];
  for(const [i,c] of s.ch.entries()){
    if(!sel.has(i))continue;
    if(c.kind==='yeni'){const np=JSON.parse(JSON.stringify(c.np));delete np.rows;for(const y of YON)if(np[y]){delete np[y].cizili;np[y].xnot=np[y].not;np[y].xdurum=np[y].durum;np[y].seferId='';if(np.katilim!==false)want(np[y],y,np.kurum,id=>{np[y].seferId=id;});}newDocs.push(np);bump('yeni');}
    else if(c.kind==='degisen'){
      const p=S.people.get(c.pid);if(!p)continue;const patch=JSON.parse(JSON.stringify(c.patch));const msgs=c.msgs.slice();
      const offNow=patch.katilim===false;
      for(const y of YON){
        const L=p[y];let lp=patch[y];
        if(offNow&&L){lp=patch[y]=Object.assign(lp||{},{seferId:''});continue;}
        if(!lp)continue;
        if(!L){lp.seferId='';want(lp,y,patch.kurum||p.kurum,id=>{lp.seferId=id;});continue;}
        const view=Object.assign({},L,lp);
        if(view.durum!=='bekliyor'&&view.durum!=='rotar'){if(L.seferId)lp.seferId='';continue;}
        if(lp.saat!=null||lp.tarih!=null||lp.durum==='bekliyor'){
          const t=L.seferId&&local.get(L.seferId);
          const fits=t&&t.tarih===view.tarih&&t.yon===y&&(!view.saat||!t.saat||Math.abs(toMin(t.saat)-toMin(view.saat))<=45);
          if(!fits){const old=L.seferId&&S.trips.get(L.seferId);lp.seferId='';
            if(old)msgs.push(`${YON_T[y]} aracı ${tripLabel(old)} kaldırıldı (saat/tarih değişti)`);
            if(p.katilim!==false||patch.katilim===true)want(view,y,patch.kurum||p.kurum,id=>{lp.seferId=id;const t2=local.get(id);msgs.push(`${YON_T[y]} aracı: ${t2?tripLabel(t2):'yeni sefer'}`);});}
        }
      }
      patches.push({pid:p.id,patch,msgs});bump('degisen');
    }
    else if(c.kind==='bacakkalkti'){legOff.push(c);bump('bacakkalkti');}
    else if(c.kind==='yok'){gone.push(c.pid);bump('yok');}
  }
  const touched=new Set();for(const x of patches)for(const y of YON)if(x.patch[y]&&'seferId' in x.patch[y])touched.add(x.pid+'|'+y);
  for(const c of legOff)touched.add(c.pid+'|'+c.y);for(const id of gone)for(const y of YON)touched.add(id+'|'+y);
  const moves=[];
  for(const x of freed){const k=x.p.id+'|'+x.y;if(touched.has(k))continue;const mv={pid:x.p.id,y:x.y,tid:''};moves.push(mv);want(x.L,x.y,x.p.kurum,id=>{mv.tid=id;});}
  for(const k of new Set([...pend.keys(),...newKeys])){
    const [d,y,sa]=k.split('|');
    const trips=[...local.values()].filter(t=>t.tarih===d&&t.yon===y&&t.saat===sa);if(!trips.length)continue;
    const items=(pend.get(k)||[]).slice();
    const base=new Map(trips.map(t=>{const l=loadOf(t.id);return [t.id,l.n+l.m];}));
    if(newKeys.has(k)){ // bu saate yeni/değişen araç geldiyse o saatte araçsız kalanlar da alınır
      for(const p of S.people.values())for(const y2 of YON){if(y2!==y)continue;const L=p[y2];if(!L||L.tarih!==d||L.saat!==sa||!rides(p,L)||touched.has(p.id+'|'+y2))continue;if(L.seferId&&local.has(L.seferId))continue;if(items.some(it=>it.pid===p.id))continue;
        items.push({pid:p.id,n:1+misafir(L),kurum:p.kurum||'',set:id=>moves.push({pid:p.id,y:y2,tid:id})});}
    }
    if(newKeys.has(k)&&trips.some(t=>(base.get(t.id)||0)>(+t.kapasite||0))){
      for(const t of trips)for(const x of (S.idx.pax.get(t.id)||[])){if(touched.has(x.p.id+'|'+x.y))continue;items.push({n:1+misafir(x.L),kurum:x.p.kurum||'',set:id=>{if(id!==x.L.seferId)moves.push({pid:x.p.id,y:x.y,tid:id});}});}
      for(const t of trips)base.set(t.id,0);
    }
    if(!items.length)continue;
    for(const [it,tid] of planDistribution(items,trips,base))it.set(tid);
  }
  let sira=Math.max(0,...[...S.people.values()].map(p=>+p.sira||0));
  for(const np of newDocs)enqueue({op:'set',path:'kisiler/'+newId('k'),data:Object.assign({},np,{not:'',sira:++sira,gecmis:[logE(`Excel güncellemesinden eklendi (${s.dosya})`)],guncelleme:nowIso(),guncelleyen:S.uid||''}),label:np.ad});
  for(const x of patches){const p=S.people.get(x.pid);if(p)updPerson(p,x.patch,x.msgs.map(m=>m+' (Excel güncellemesi)'));}
  for(const c of legOff){const p=S.people.get(c.pid);if(p)updPerson(p,{[c.y]:{durum:'iptal',xdurum:'iptal',seferId:''}},[`${YON_T[c.y]} transferi yeni Excel listesinde yok: iptal edildi (${s.dosya})`]);}
  for(const id of gone){const p=S.people.get(id);if(!p)continue;const pt={katilim:false};for(const y of YON)if(p[y])pt[y]={seferId:''};updPerson(p,pt,[`Yeni Excel listesinde yok (${s.dosya}): katılmayacak olarak işaretlendi`]);}
  const byT=new Map();for(const m of moves){const t=m.tid||'';if(!byT.has(t))byT.set(t,[]);byT.get(t).push(m);}
  let moved=0;for(const [tid,arr] of byT)moved+=assignLegs(arr,tid,'Excel güncellemesi: araçlar değişti');
  enqueue({op:'set',path:'meta/ayarlar',data:Object.assign({},S.meta,S.meta.kaynakDosya?{}:{kaynakDosya:s.dosya},{sonIceAktarma:{t:nowIso(),dosya:s.dosya,degisiklik:n}}),label:'Ayarlar'});
  // Doğrulama: dosya uygulamaya işlendikten sonra yeniden karşılaştır
  const after=diffImport(s.parsed);
  buildIndex();
  const aracsiz=legs().filter(x=>rides(x.p,x.L)&&x.L.saat&&!(x.L.seferId&&S.trips.has(x.L.seferId))).length;
  openSheet({type:'impres',dosya:s.dosya,n,cnt,moved,kalan:after.ch,supheli:s.supheli,aracsiz},true);
}
function supheliHtml(list,open){
  if(!list.length)return '';
  return `<details class="card" ${open?'open':''}><summary class="ihead warn" style="cursor:pointer">${ic('alert')} Kontrol etmeniz gereken satırlar <span class="chip warn" style="margin-left:auto">${list.length}</span>${ic('down')}</summary>${list.map(x=>`<div class="iss" style="cursor:default"><span class="small"><b>${esc(x.ad||'')}</b> · ${esc(x.msg)}<br><span class="muted">${esc(x.where||'')}</span></span><span></span></div>`).join('')}</details>`;
}

/* ================= birden fazla araca bölme ================= */
/* items: [{n (yer), kurum, ...}] · trips: [{id,kapasite}] · base: Map(tripId → dolu yer)
   Kurumlar bir arada tutulur; büyük gruplar önce, büyük araçlar önce doldurulur. */
function planDistribution(items,trips,base){
  const rem=trips.slice().sort((a,b)=>(+b.kapasite||0)-(+a.kapasite||0)).map(t=>({t,r:(+t.kapasite||0)-((base&&base.get(t.id))||0)}));
  const res=new Map();if(!rem.length)return res;
  const groups=new Map();for(const it of items){const g=it.kurum||'';if(!groups.has(g))groups.set(g,[]);groups.get(g).push(it);}
  const sumN=g=>g.reduce((a,x)=>a+x.n,0);
  const gs=[...groups.values()].sort((a,b)=>sumN(b)-sumN(a));
  for(const g of gs){
    const need=sumN(g);const tr=rem.find(x=>x.r>=need);
    if(tr){for(const it of g)res.set(it,tr.t.id);tr.r-=need;continue;}
    for(const it of g.slice().sort((a,b)=>b.n-a.n)){const t2=rem.find(x=>x.r>=it.n)||rem.reduce((a,b)=>b.r>a.r?b:a);res.set(it,t2.t.id);t2.r-=it.n;}
  }
  return res;
}
function assignPlan(){
  const s=S.sheet;
  const items=s.items.map(x=>({pid:x.pid,y:x.y,p:S.people.get(x.pid)})).filter(x=>x.p&&x.p[x.y]&&rides(x.p,x.p[x.y]));
  const chosen=$$('input[data-as]').filter(c=>c.checked).map(c=>S.trips.get(c.dataset.as)).filter(Boolean);
  const nNew=+((($('#as_n')||{}).value)||0),aNew=($('#as_arac')||{}).value||'VİTO';
  const virt=[];for(let i=0;i<nNew;i++)virt.push({id:'__yeni'+i,arac:aNew,kapasite:capOf(aNew),saat:s.saat,tarih:s.tarih,yon:s.yon,yeni:true});
  const trips=[...chosen,...virt];
  const base=new Map();
  for(const t of chosen){const l=loadOf(t.id);let b=l.n+l.m;for(const x of items)if(x.p[x.y].seferId===t.id)b-=1+misafir(x.p[x.y]);base.set(t.id,Math.max(0,b));}
  const plan=planDistribution(items.map(x=>({x,n:1+misafir(x.p[x.y]),kurum:x.p.kurum||''})),trips,base);
  return {items,trips,virt,base,plan};
}
function renderAssignPrev(){
  const el=$('#as_prev');if(!el)return;
  const P=assignPlan();
  if(!P.trips.length){el.innerHTML='<span class="muted">Araç seçilmedi.</span>';return;}
  const add=new Map(),cnt=new Map();for(const [w,tid] of P.plan){add.set(tid,(add.get(tid)||0)+w.n);cnt.set(tid,(cnt.get(tid)||0)+1);}
  el.innerHTML=P.trips.map(t=>{const b=P.base.get(t.id)||0,a=add.get(t.id)||0,tot=b+a,cap=+t.kapasite||0;
    return `<div class="row between" style="padding:5px 0;border-top:1px solid var(--line)"><span>${t.yeni?'<span class="chip info">yeni</span> '+esc((ARAC_T[t.arac]||t.arac)+' '+(t.saat||'')):esc(tripLabel(t))}<br><span class="muted">${cnt.get(t.id)||0} kişi bu gruptan${b?' · '+b+' yer başka gruptan dolu':''}</span></span><b style="color:${tot>cap?'var(--bad)':'var(--ok)'}">${tot}/${cap}</b></div>`;}).join('')
    +(P.trips.length>1?'':'<div class="muted" style="padding-top:4px">Tek araç seçili: hepsi bu araca atanır.</div>');
}

/* ================= telefon: bildirimler ve geri tuşu ================= */
let remT=0,lastRem='';
function scheduleRemSync(){clearTimeout(remT);remT=setTimeout(syncReminders,800);}
function hashId(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 5000+Math.abs(h)%900000;}
function syncReminders(){
  if(!NB||!NB.setReminders||!S.loadedP||!S.loadedT)return;
  const bc=S.meta.bildirim||{},on=bc.on!==false,lead=+bc.lead||30,now=Date.now(),items=[];
  if(on)for(const d of allDays())for(const y of YON)for(const s of slotsFor(d,y)){
    if(!s.saat||!s.n)continue;
    const T=legTime(d,s.saat);const wait=s.act.filter(x=>x.L.durum==='bekliyor'||x.L.durum==='rotar');
    if(!wait.length)continue;
    const nid=hashId(s.key),hedef=s.key,trs=s.tripIds.map(id=>tripLabel(S.trips.get(id))).join(', '),un=s.unassigned.length;
    const pre=T-lead*60000;
    if(pre>now+5000)items.push({at:pre,nid,hedef,title:`${s.saat} ${y==='gelis'?'varış':'otelden biniş'} · ${lead} dk kaldı`,text:`${dayLong(d)} · ${YON_L[y]}\n${wait.length} kişi${s.m?' (+'+s.m+' misafir)':''} · ${kurumSummary(s.act)}\nAraç: ${trs||'atanmadı'}${un?` · ${un} kişi araçsız!`:''}`});
    const bek=s.act.filter(x=>x.L.durum==='bekliyor').length,late=T+graceMin(y)*60000;
    if(bek&&late>now+5000)items.push({at:late,nid,hedef,title:`İşaretlenmedi: ${s.saat} ${y==='gelis'?'varış':'biniş'}`,text:`${dayLong(d)} · ${YON_L[y]}\n${bek} kişi hâlâ “Bekleniyor”. ${y==='gelis'?'Karşılandılar mı?':'Araca bindiler mi?'} Uygulamada işaretleyin.`});
  }
  items.sort((a,b)=>a.at-b.at);
  const json=JSON.stringify(items.slice(0,350));
  if(json===lastRem)return;lastRem=json;
  try{NB.setReminders(json);}catch(e){}
}
function fillBildirimDurum(){
  const el=$('#b_durum');if(!el)return;
  if(!NB||!NB.reminderStatus){el.innerHTML='<span class="muted">Bildirimler telefonda çalışır.</span>';return;}
  let d={};try{d=JSON.parse(NB.reminderStatus());}catch(e){}
  const rows=[];
  rows.push(d.bildirim?`<span style="color:var(--ok)">${ic('check')} Bildirim izni açık</span>`:`<span class="row" style="color:var(--bad)">${ic('alert')} Bildirimler kapalı <button class="btn sm" data-a="ayar" data-n="bildirim">Aç</button></span>`);
  if(!d.tamAlarm)rows.push(`<span class="row" style="color:var(--warn)">${ic('alert')} Tam saat alarmı izni yok, uyarılar gecikebilir <button class="btn sm" data-a="ayar" data-n="alarm">İzin ver</button></span>`);
  if(!d.pil)rows.push(`<span class="row muted">Pil tasarrufu uyarıları geciktirebilir <button class="btn sm" data-a="ayar" data-n="pil">Kısıtlamayı kaldır</button></span>`);
  rows.push(`<span class="muted">${d.adet||0} uyarı kurulu${d.sonraki?' · sıradaki: '+fmtTime(new Date(d.sonraki).toISOString()):''}</span>`);
  el.innerHTML=rows.join('');
}
window.setInsets=(t,b)=>{const r=document.documentElement.style;r.setProperty('--sat',t+'px');r.setProperty('--sab',b+'px');};
window.handleBack=()=>{
  if(!$('#dlg').hidden){$('#dlg').click();return true;}
  if(S.sheet){ACT.close();return true;}

window.onNativeAction=h=>{
  const [d,y]=String(h).split('|');if(!d||!y)return;

/* ================= boot ================= */
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({t:nowIso(),p:[...S.rawP.values()],tr:[...S.rawT.values()],meta:S.meta}));}catch(e){}}
let cacheT=0;const queueCache=()=>{clearTimeout(cacheT);cacheT=setTimeout(saveCache,3000);};
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(!c)return false;S.rawP=new Map(c.p.map(x=>[x.id,x]));S.rawT=new Map(c.tr.map(x=>[x.id,x]));S.meta=c.meta||{};S.cacheTime=c.t;S.cacheMode=true;S.canWrite=false;rebuild();return true;}catch(e){return false;}}
const use=n=>{try{return window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);}catch(e){return Promise.resolve(null);}};
async function boot(){
  const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;
  tickClock();setInterval(tickClock,15000);setInterval(render,60000);
  render();
  const [db,user,dl]=await Promise.all([use('db'),use('user'),use('downloads')]);
  S.db=db;S.user=user;S.dl=dl;
  if(user){try{S.uid=(await user.id())||'';}catch(e){}try{const c=await user.can('data.write');if(c===false)S.canWrite=false;}catch(e){}}
  if(!db){S.noDb=true;loadCache();render();return;}
  const timer=setTimeout(()=>{if(!S.loadedP||!S.loadedT){S.slow=true;if(!S.loadedP&&!S.rawP.size)loadCache();render();}},10000);
  const done=()=>{if(S.loadedP&&S.loadedT){clearTimeout(timer);if(S.cacheMode){S.cacheMode=false;S.canWrite=true;if(user)user.can('data.write').then(c=>{if(c===false){S.canWrite=false;render();}}).catch(()=>{});}}};
  const onErr=e=>{S.slow=true;toast('Canlı bağlantı kesildi: '+errText(e)+'. Sayfayı yeniden açın.','bad',null,10000);render();};
  db.collection('kisiler').onSnapshot(snap=>{S.rawP=new Map(snap.docs.map(d=>[d.id,Object.assign({},d.data(),{id:d.id})]));if(!snap.metadata.fromCache||snap.size)S.loadedP=true;S.fromCache=snap.metadata.fromCache;done();rebuild();queueCache();},onErr);
  db.collection('seferler').onSnapshot(snap=>{S.rawT=new Map(snap.docs.map(d=>[d.id,Object.assign({},d.data(),{id:d.id})]));if(!snap.metadata.fromCache||snap.size)S.loadedT=true;done();rebuild();queueCache();},onErr);
  db.doc('meta/ayarlar').onSnapshot(snap=>{S.meta=snap.exists?Object.assign({},snap.data()):{};render();},()=>{});
}
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h)&&S.tab!==h){S.tab=h;render();window.scrollTo(0,0);}});
boot();
