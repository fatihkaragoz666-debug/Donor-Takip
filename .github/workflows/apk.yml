name: APK oluştur

on:
  push:
    branches: [ main, master ]
    # Antalya Transfer (transfer-apk.yml) ve Berber Randevu (berber-apk.yml) ayrı derlenir; onların dosyaları Donör Takip'i yeniden derletmez.
    paths-ignore:
      - 'transfer/**'
      - '.github/workflows/transfer-apk.yml'
      - 'berber/**'
      - '.github/workflows/berber-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "DonorTakip-1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: APK'yı derleme sonucuna ekle
        uses: actions/upload-artifact@v4
        with:
          name: DonorTakip-APK
          path: DonorTakip-*.apk

      - name: Sürüm (Release) oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Donör Takip 1.0.${{ github.run_number }}
          body: Telefona indirip kurun. Önceki sürümün üzerine kurulur, veriler korunur.
          files: DonorTakip-*.apk
