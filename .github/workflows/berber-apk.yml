name: Berber Randevu APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'berber/**'
      - '.github/workflows/berber-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew -p berber assembleRelease --no-daemon --stacktrace
          cp berber/app/build/outputs/apk/release/app-release.apk "BerberRandevu-1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: APK'yı derleme sonucuna ekle
        uses: actions/upload-artifact@v4
        with:
          name: BerberRandevu-APK
          path: BerberRandevu-*.apk

      - name: Sürüm (Release) oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: berber-v1.0.${{ github.run_number }}
          name: Berber Randevu 1.0.${{ github.run_number }}
          body: Berber randevu uygulaması. Telefona indirip kurun; önceki sürümün üzerine kurulur, randevular korunur. Donör Takip'ten ayrı bir uygulamadır.
          make_latest: false
          files: BerberRandevu-*.apk
